<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AFG 보장분석 리포트</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  :root {
    --navy:#4F46E5; --navy2:#4338CA; --paper:#F8FAFC; --line:#E2E8F0;
    --ink:#0F172A; --muted:#64748B; --card:#fff;
    --green:#047857; --green-bg:#ECFDF5; --amber:#B45309; --amber-bg:#FFFBEB;
    --red:#DC2626; --red-bg:#FEF2F2; --pink:#BE185D; --pink-bg:#FDF2F8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; background: var(--paper); color: var(--ink); }
  td, th, .card, .sub, label, button { word-break: keep-all; }
  .topbar { background: #0F1B3D; color: #fff; padding: 12px 20px; font-size: 16px; font-weight: 800; }
  .topbar small { font-weight: 500; opacity: .75; margin-left: 8px; font-size: 12px; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px 24px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(15,23,42,.04), 0 4px 14px rgba(15,23,42,.05); }
  .sub { font-size: 13px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
  label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; }
  input, select, textarea { width: 100%; border: 1px solid #CBD5E1; border-radius: 10px; padding: 9px 12px; font-size: 14px; background: #fff; color: var(--ink); font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(99,102,241,.18); }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { padding: 10px 10px; border-bottom: 1px solid #F1F5F9; text-align: left; }
  th { background: #F8FAFC; color: #475569; font-weight: 700; font-size: 12px; }
  button { font-family: inherit; font-weight: 600; cursor: pointer; }
  button.act { background: var(--navy); color: #fff; border: none; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 700; }
  button.act:hover { background: var(--navy2); }
  button.secondary { background: #F1F5F9; color: #1E293B; border: none; border-radius: 10px; padding: 8px 14px; font-size: 13px; }
  button.secondary:hover { background: #E2E8F0; }
  button.danger { background: var(--red-bg); color: var(--red); border: none; border-radius: 10px; padding: 8px 14px; font-size: 13px; }
  button.small { padding: 6px 12px; font-size: 12.5px; border-radius: 8px; }
  .panel { display: block; }
</style>
<style id="cv_style">
/* ===== 보장분석 탭 ===== */
#panel-coverage .cv-drop { border: 2px dashed var(--line); border-radius: 12px; background: #FAFAF7; padding: 26px 16px; text-align: center; cursor: pointer; color: var(--muted); font-size: 13.5px; line-height: 1.6; }
#panel-coverage .cv-drop.over { border-color: var(--navy); background: #EEF1F8; color: var(--navy); }
#panel-coverage .cv-drop b { color: var(--ink); }
#panel-coverage .cv-drop small { display: block; font-size: 11.5px; margin-top: 4px; }
#panel-coverage .cv-msg { display: none; margin-top: 10px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px; line-height: 1.5; }
#panel-coverage .cv-msg.err { display: block; background: var(--red-bg); color: var(--red); }
#panel-coverage .cv-msg.ok { display: block; background: var(--green-bg); color: var(--green); }
#panel-coverage .cv-msg.busy { display: block; background: #EEF1F8; color: var(--navy); }
#panel-coverage .cv-warn { margin: 0 0 12px; padding: 9px 12px; border-radius: 8px; background: var(--amber-bg); color: #7A5A1E; font-size: 12px; line-height: 1.55; }
#panel-coverage .cv-warn ul { margin: 4px 0 0; padding-left: 18px; }
#panel-coverage .cv-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 20px; padding: 5px 6px 5px 12px; font-size: 12px; margin: 4px 6px 0 0; background: #fff; cursor: pointer; }
#panel-coverage .cv-chip.on { border-color: var(--navy); background: #EEF1F8; font-weight: 700; }
#panel-coverage .cv-chip input { width: auto; margin: 0; }
#panel-coverage .cv-chip button { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 4px; }
#panel-coverage .cv-opts { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-top: 12px; }
#panel-coverage .cv-opts > div { min-width: 130px; }
#panel-coverage .cv-opts .grow { flex: 1; min-width: 200px; }
#panel-coverage .cv-opts label.ck { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink); margin: 0 0 9px; }
#panel-coverage .cv-opts label.ck input { width: auto; margin: 0; }
#panel-coverage .cv-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
#panel-coverage .cv-stage { background: #E9E6DD; border-radius: 12px; padding: 14px; overflow-x: auto; text-align: center; margin-bottom: 16px; }
#panel-coverage #cv_scaler { display: inline-block; text-align: left; box-shadow: 0 2px 14px rgba(0,0,0,.16); background: #fff; }
#panel-coverage .cv-help { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
#panel-coverage details.cv-det { border-top: 1px solid var(--line); padding: 10px 0 2px; }
#panel-coverage details.cv-det:first-of-type { border-top: none; }
#panel-coverage details.cv-det > summary { cursor: pointer; font-size: 13px; font-weight: 700; color: var(--navy); padding: 2px 0 6px; }
#panel-coverage .cv-ev { font-size: 12px; line-height: 1.55; padding: 5px 0; border-bottom: 1px dashed #EFEDE6; }
#panel-coverage .cv-ev b { margin-right: 6px; }
#panel-coverage .cv-ev .mu { color: var(--muted); }
#panel-coverage .cv-scroll { max-height: 320px; overflow-y: auto; border: 1px solid #EFEDE6; border-radius: 8px; padding: 0 8px; }
#panel-coverage .cv-um { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid #F3F1EC; font-size: 12px; }
#panel-coverage .cv-um .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#panel-coverage .cv-um .am { width: 64px; text-align: right; color: var(--muted); flex-shrink: 0; }
#panel-coverage .cv-um select { width: 170px; flex-shrink: 0; font-size: 12px; padding: 5px 6px; }
#panel-coverage .cv-recgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 14px; }
#panel-coverage .cv-recgrid label { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 12px; color: var(--ink); }
#panel-coverage .cv-recgrid label span { flex: 1; min-width: 0; }
#panel-coverage .cv-recgrid input { width: 78px; padding: 5px 6px; font-size: 12px; text-align: right; }
#panel-coverage .cv-logorow { display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px; }
#panel-coverage .cv-logorow img { height: 22px; width: auto; }
#panel-coverage .cv-logorow input[type=file] { width: auto; font-size: 11.5px; border: none; padding: 0; }

/* ===== 리포트(미리보기 · 이미지 저장 · 인쇄 공용) ===== */
.cvr, .cvr * { box-sizing: border-box; }
.cvr { width: 794px; background: #fff; color: #1B1B1B; padding: 26px 28px 20px; line-height: 1.25;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
.cvr b { font-weight: 800; }
.cvr img { max-width: none; }
.cvr .cvr-h { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 9px; border-bottom: 2px solid #16233F; }
.cvr .cvr-h .tt { font-size: 24px; font-weight: 800; letter-spacing: -.5px; color: #111; }
.cvr .cvr-h .tt small { font-size: 14px; font-weight: 600; color: #667085; margin-left: 8px; letter-spacing: 0; }
.cvr .cvr-h .meta { text-align: right; font-size: 10.5px; color: #667085; line-height: 1.55; }
.cvr .cvr-h .meta b { color: #16233F; }
.cvr .cvr-prem { display: flex; justify-content: space-between; align-items: center; background: #E8EEF8; border-radius: 8px; padding: 9px 16px; margin: 12px 0 10px; }
.cvr .cvr-prem .l { font-size: 13px; font-weight: 800; color: #16233F; }
.cvr .cvr-prem .l small { display: block; font-size: 9.5px; font-weight: 500; color: #667085; margin-top: 2px; }
.cvr .cvr-prem .v { font-size: 27px; font-weight: 800; color: #111; letter-spacing: -.5px; }
.cvr .cvr-prem .v small { font-size: 15px; font-weight: 700; margin-left: 2px; }
.cvr .cvr-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 12px; }
.cvr .cd { border: 1px solid #D9DFEA; border-radius: 8px; padding: 7px 9px 8px; background: #fff; min-width: 0; }
.cvr .cd-t { display: flex; align-items: center; gap: 6px; height: 24px; }
.cvr .cn2 { display: inline-block; width: 17px; height: 17px; line-height: 15px; text-align: center; border: 1.3px solid #16233F; border-radius: 50%; font-size: 9.5px; font-weight: 800; color: #16233F; flex-shrink: 0; }
.cvr .lg { height: 19px; width: auto; max-width: 104px; }
.cvr .lgt { font-size: 11px; font-weight: 800; color: #16233F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cvr .cd-p { margin-top: 5px; font-size: 13px; color: #111; white-space: nowrap; }
.cvr .cd-p b { font-weight: 800; }
.cvr .cd-p span { font-size: 9.5px; color: #667085; margin-left: 4px; }
.cvr .cd-p.na { font-size: 11px; color: #98A2B3; font-weight: 700; }

.cvr table.t { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; margin: 0; font-size: 10.5px; }
.cvr table.t th, .cvr table.t td { padding: 0 5px; border: 0; border-bottom: 1px solid #E3E8F0; text-align: left; vertical-align: middle; height: 21px; overflow: hidden; white-space: nowrap; color: #1B1B1B; }
.cvr table.t th { background: #EEF2F8; color: #16233F; font-weight: 800; font-size: 10px; height: 34px; text-align: center; border-bottom: 2px solid #16233F; line-height: 1.25; white-space: normal; }
.cvr table.t th .cn { display: inline-block; width: 13px; height: 13px; line-height: 11px; text-align: center; border: 1px solid #16233F; border-radius: 50%; font-size: 8px; font-weight: 800; margin-bottom: 1px; }
.cvr table.t th.cch { font-size: 9px; font-weight: 700; padding: 0 1px; }
.cvr table.t tr.sect td { background: #16233F; color: #fff; height: 25px; padding: 0 10px; border-bottom: 0; }
.cvr table.t tr.sect .sb { display: flex; justify-content: space-between; align-items: center; }
.cvr table.t tr.sect .sb b { font-size: 12px; }
.cvr table.t tr.sect .sb em { font-style: normal; font-size: 10px; color: #B9C6DE; margin-left: 8px; font-weight: 500; }
.cvr table.t tr.sect .sb .tag { font-size: 10px; color: #DCE5F5; font-weight: 500; }
.cvr table.t td.g { background: #EAF0F8; font-weight: 800; text-align: center; font-size: 12px; color: #16233F; border-right: 1px solid #D5DCE8; padding: 0 2px; }
.cvr table.t td.it { font-weight: 600; white-space: normal; line-height: 1.15; }
.cvr table.t td.it.sm { font-size: 9.5px; }
.cvr table.t td.it .mk { color: #98A2B3; margin-right: 4px; font-weight: 400; }
.cvr table.t td.it .tg { font-size: 8.5px; color: #667085; font-weight: 500; margin-left: 4px; }
.cvr table.t td.rc { text-align: right; color: #475467; padding-right: 8px; }
.cvr table.t td.st { text-align: center; padding: 0 2px; }
.cvr table.t td.tot { text-align: right; font-weight: 800; font-size: 11px; padding-right: 8px; }
.cvr table.t td.tot.z, .cvr table.t td.cc.z { color: #B4BBC8; font-weight: 500; }
.cvr table.t td.cc { text-align: center; padding: 0 1px; font-size: 10px; color: #344054; }
.cvr table.t td.cc.p1 { background: #F7F9FC; }
.cvr table.t td.subh { background: #F5F7FB; color: #16233F; font-size: 10.5px; height: 20px; }
.cvr table.t td.subh .tg { font-size: 9px; color: #667085; margin-left: 6px; font-weight: 500; }
.cvr .pl { display: inline-block; min-width: 34px; text-align: center; padding: 2px 6px; border-radius: 10px; font-size: 9.5px; font-weight: 800; color: #fff; line-height: 1.25; }
.cvr .pl.ok { background: #2FA26B; }
.cvr .pl.part { background: #F29D0C; }
.cvr .pl.none { background: #E5383B; }
.cvr .pl.have { background: #fff; color: #2FA26B; border: 1px solid #2FA26B; padding: 1px 5px; }
.cvr .pl.unknown { background: #98A2B3; min-width: 0; font-size: 8.5px; padding: 2px 4px; }
.cvr .cvr-foot { margin-top: 10px; font-size: 8.5px; color: #667085; line-height: 1.55; }
.cvr .cvr-foot p { margin: 0 0 2px; }
.cvr .cvr-foot .who { margin-top: 5px; font-size: 10px; font-weight: 700; color: #16233F; }
#cv_report .tot.click { cursor: pointer; }
#cv_report .tot.click:hover { background: #FFF7E0; }
#cv_report .tot.ov { text-decoration: underline dotted #B8863B; }
#panel-coverage .card:empty { display: none; }

/* ===== 보험 정리 표 (편집 화면) ===== */
#panel-coverage .cv-plan-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 8px; }
#panel-coverage .cv-plan-box { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 12px; background: #FCFBF8; }
#panel-coverage .cv-plan-box h4 { margin: 0 0 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
#panel-coverage .cv-plan-box h4 span { font-weight: 500; font-size: 12px; color: var(--muted); }
#panel-coverage .cv-pl-row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
#panel-coverage .cv-pl-row input[type=text] { padding: 6px 8px; font-size: 12.5px; }
#panel-coverage .cv-pl-row .nm { flex: 1; min-width: 150px; width: auto; }
#panel-coverage .cv-pl-row .pm { width: 92px; text-align: right; flex-shrink: 0; }
#panel-coverage .cv-pl-row .del { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0 4px; }
#panel-coverage .cv-pl-row label.cv { display: flex; align-items: center; gap: 4px; margin: 0; font-size: 11.5px; color: var(--ink); white-space: nowrap; }
#panel-coverage .cv-pl-row label.cv input { width: auto; margin: 0; }
#panel-coverage .cv-pl-imp { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 0; border-bottom: 1px dashed #EFEDE6; }
#panel-coverage .cv-pl-imp .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#panel-coverage .cv-pl-notes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
#panel-coverage .cv-pl-notes > div { flex: 1; min-width: 220px; }

/* ===== 보험 정리 표 (이미지로 저장되는 카드) ===== */
.cvp, .cvp * { box-sizing: border-box; }
.cvp { width: 794px; background: #fff; color: #1B1B1B; padding: 14px; line-height: 1.4;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
.cvp .pg { display: grid; grid-template-columns: 1fr 1.3fr 1fr; border: 1px solid #DCE1EA; border-radius: 10px; overflow: hidden; }
.cvp .hd { padding: 12px 10px; text-align: center; font-weight: 800; font-size: 15px; }
.cvp .hd.k { background: #E3F5F0; color: #1E8A78; }
.cvp .hd.d { background: #FDE8EA; color: #D0404C; }
.cvp .hd.n { background: #F0F2F5; color: #475467; }
.cvp .bd { padding: 16px 18px 18px; font-size: 13.5px; border-top: 1px solid #DCE1EA; min-height: 150px; }
.cvp .bd.m { border-left: 1px solid #DCE1EA; border-right: 1px solid #DCE1EA; }
.cvp .li { display: flex; gap: 7px; margin-bottom: 8px; }
.cvp .li .dot { flex-shrink: 0; }
.cvp .li .tx { min-width: 0; word-break: keep-all; overflow-wrap: anywhere; }
.cvp .none { color: #98A2B3; font-size: 12.5px; }
.cvp .tl { margin-top: 10px; font-weight: 800; font-size: 14px; }
.cvp .sep { border-top: 1px dashed #C9D0DC; margin: 14px 0 10px; }
.cvp .rp { color: #D0404C; font-weight: 800; margin-bottom: 8px; font-size: 13.5px; }
.cvp .rw { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 9px 0; border-bottom: 1px solid #EEF0F4; }
.cvp .rw .lb { font-size: 13px; color: #344054; }
.cvp .rw .lb small { display: block; font-size: 10px; color: #98A2B3; margin-top: 1px; }
.cvp .rw .vl { font-weight: 800; font-size: 14px; white-space: nowrap; }
.cvp .rw .vl.neg { color: #D0404C; }
.cvp .rw .vl small { font-weight: 500; font-size: 11px; }
.cvp .pill { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 12px; padding: 10px 12px; border-radius: 9px; background: #E3F5F0; color: #1E8A78; font-size: 12.5px; }
.cvp .pill b { font-size: 16px; font-weight: 800; white-space: nowrap; }
.cvp .pill.up { background: #FFF1D6; color: #A86400; }
.cvp .en { margin-top: 12px; font-size: 12.5px; color: #667085; }

/* ===== 회사별 상세 직접 입력 표 ===== */
#panel-coverage .cv-mwrap { overflow: auto; border: 1px solid var(--line); border-radius: 8px; max-height: 540px; background: #fff; }
#panel-coverage .cv-mt { width: auto; min-width: 100%; table-layout: auto; border-collapse: separate; border-spacing: 0; font-size: 12px; margin: 0; }
#panel-coverage .cv-mt th, #panel-coverage .cv-mt td { padding: 3px 5px; border-bottom: 1px solid #F0EEE8; text-align: right; white-space: nowrap; vertical-align: middle; }
#panel-coverage .cv-mt thead th { position: sticky; top: 0; background: #F3F1EC; z-index: 2; font-size: 11.5px; color: var(--ink); }
#panel-coverage .cv-mt th.l, #panel-coverage .cv-mt td.l { text-align: left; position: sticky; left: 0; background: #fff; min-width: 200px; z-index: 1; }
#panel-coverage .cv-mt thead th.l { z-index: 3; background: #F3F1EC; }
#panel-coverage .cv-mt tr.inf td { background: #FAFAF7; }
#panel-coverage .cv-mt tr.inf td.l { background: #FAFAF7; font-weight: 700; }
#panel-coverage .cv-mt td.l .g { display: inline-block; width: 34px; color: var(--muted); font-size: 11px; }
#panel-coverage .cv-mt td.pd { color: var(--muted); }
#panel-coverage .cv-mt td.sm { font-weight: 700; min-width: 64px; }
#panel-coverage .cv-mt td.sm.warn { color: #B8620B; background: var(--amber-bg); }
#panel-coverage .cv-mt input { width: 96px; padding: 4px 6px; font-size: 12px; text-align: right; }
#panel-coverage .cv-mt input.bad { border-color: var(--red); background: var(--red-bg); }
#panel-coverage .cv-mt th button { border: none; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 2px; }
#panel-coverage .cv-mline { font-size: 12px; margin: 8px 0 0; color: var(--ink); }
#panel-coverage .cv-mline.warn { color: #B8620B; }

/* ===== 보험 정리 전·후 보장 비교 (이미지 카드) ===== */
.cvc, .cvc * { box-sizing: border-box; }
.cvc { width: 794px; background: #fff; color: #1B1B1B; padding: 26px 28px 20px; line-height: 1.3;
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
.cvc .hd { display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 9px; border-bottom: 2px solid #16233F; }
.cvc .hd .tt { font-size: 23px; font-weight: 800; letter-spacing: -.5px; color: #111; }
.cvc .hd .tt small { font-size: 14px; font-weight: 600; color: #667085; margin-left: 8px; letter-spacing: 0; }
.cvc .hd .meta { text-align: right; font-size: 10.5px; color: #667085; line-height: 1.55; }
.cvc .top { display: flex; gap: 12px; margin: 14px 0 6px; }
.cvc .stkbox { flex: 1.55; border: 1px solid #D9DFEA; border-radius: 10px; padding: 12px 14px 10px; }
.cvc .stkbox .ttl { font-size: 11.5px; font-weight: 800; color: #16233F; margin-bottom: 9px; }
.cvc .stkrow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.cvc .stkrow .lb { width: 44px; font-size: 11px; font-weight: 800; color: #475467; flex-shrink: 0; }
.cvc .stk { flex: 1; display: flex; height: 24px; border-radius: 6px; overflow: hidden; background: #EEF1F6; }

    if (/(상해|재해).{0,6}사망/.test(n)) return ['inj_death'];
    if (/질병.{0,2}사망/.test(n)) return ['dis_death'];
    if (/암사망/.test(n)) return [];
    if (/(일반사망|주계약.*사망|사망보험금|종신.*사망|정기.*사망)/.test(n) && !/교통|재해|상해|질병|암|후유/.test(n)) return ['dis_death', 'inj_death'];

    // 특수 암 치료비 (진단/수술보다 먼저)
    if (/양성자/.test(n) && /중입자/.test(n)) return ['proton', 'heavy'];
    if (/양성자/.test(n)) return ['proton'];
    if (/중입자/.test(n)) return ['heavy'];
    if (/표적항암|표적치료/.test(n)) return ['targeted'];
    if (/면역항암|면역치료|CAR-?T|카티/i.test(n)) return ['immune'];
    if (/로봇/.test(n) && /수술/.test(n)) return ['robot'];
    if (/항암방사선약물|항암약물방사선|항암방사선[·,]?약물|항암약물[·,]?방사선|항암방사선및약물|항암약물및방사선/.test(n)) return ['chemo_drug', 'chemo_radio'];
    if (/항암약물/.test(n)) return ['chemo_drug'];
    if (/항암방사선/.test(n)) return ['chemo_radio'];

    // 암 통합치료비 (암수술·항암약물·항암방사선 3개 항목에 20%씩)
    if (isIntegrated(n)) return RATIO_KEYS.slice();
    // 암 주요치료비 (암수술·항암약물·항암방사선 3개 항목에 각각 전액)
    if (isMajorCare(n)) return RATIO_KEYS.slice();

    // 암 진단/수술 (유사암·소액암 등은 제외 처리)
    t = n.replace(/[\(\[]?유사암제외[\)\]]?/g, '');
    if (/(유사암|소액암)/.test(t) && /진단/.test(t) && !/수술|통합치료|생활비|치료비|입원|사망|재진단/.test(t)) return ['minor_cancer'];
    t = t.replace(/유사암|소액암|갑상선암|고액암|제자리암|경계성종양|특정암|여성특정암|남녀특정암/g, '§');
    if (/암(직접치료)?수술/.test(t) && !/통합치료/.test(t)) return ['cancer_surgery'];
    if (/암진단/.test(t) && !/통합치료|재진단|이차|재발|전이|양성/.test(t)) return ['cancer_dx'];

    // 뇌 / 심장
    if (/뇌혈관.{0,12}진단/.test(n) && !/수술|치료|후유|일당|입원/.test(n)) return ['brain_dx'];
    if (/뇌혈관.{0,12}수술/.test(n)) return ['brain_surg'];
    if (/허혈성심장.{0,8}진단/.test(n) && !/수술|치료|일당|입원/.test(n)) return ['heart_dx'];
    if (/허혈성심장.{0,8}수술/.test(n)) return ['heart_surg'];
    if (/순환계/.test(n)) return ['circ'];

    // 수술 / 골절
    if (/종수술|1-?5종|1~5종/.test(n)) {
      if (/질병/.test(n)) return ['dis_major'];
      if (/상해/.test(n)) return ['inj_major'];
      return [];
    }
    t = n.replace(/\d*대질병/g, '§').replace(/특정질병|특정다빈도/g, '§');
    if (/질병수술/.test(t) && !/종/.test(t)) return ['dis_surg'];
    if (/상해수술/.test(t) && !/종/.test(t) && !/외모|특정상해|골절|화상|깁스/.test(t)) return ['inj_surg'];
    if (/골절.{0,8}진단/.test(n) && !/수술|치료/.test(n)) return ['fracture'];

    // 간병 / 간호·간병통합
    if (/입원일당|사용일당/.test(n) && (/간병인(사용|지원)/.test(n) || /간호.?간병통합/.test(n))) {
      side = /질병/.test(n) ? 'dis' : (/상해/.test(n) ? 'inj' : '');
      if (!side) return [];
      if (/간호.?간병통합/.test(n)) return ['nurse_' + side];
      region = /요양병원제외/.test(n) ? 'ex' : (/요양병원/.test(n) ? 'in' : 'ex');
      return ['cg_' + side + '_' + region];
    }

    // 배상책임
    if (/일상생활배상|가족일상|일상배상|가족생활배상/.test(n)) return ['liability'];

    // 실손의료비 (비급여 특약 제외)
    if (/의료비/.test(n) && !/비급여|3대|치아|MRI|주사|도수|자기공명|급여|응급|내원|수술|진단|치료비/.test(n)) {
      side = /질병/.test(n) ? 'dis' : (/상해/.test(n) ? 'inj' : '');
      if (side) return [side + '_indem'];
    }
    return [];
  }

  // 엑셀(보장진단) 항목명 → 모델 항목
  var XLSX_MAP = {
    '암진단': ['cancer_dx'], '유사암진단': ['minor_cancer'], '암수술': ['cancer_surgery'],
    '항암방사선약물치료비': ['chemo_drug', 'chemo_radio'],
    '표적항암치료비': ['targeted'], '중입자항암치료비': ['heavy'],
    '뇌혈관질환진단': ['brain_dx'], '뇌혈관질환수술': ['brain_surg'],
    '허혈성심장질환진단': ['heart_dx'], '허혈성심장질환수술': ['heart_surg'],
    '질병실손의료비': ['dis_indem'], '상해실손의료비': ['inj_indem'],
    '질병사망': ['dis_death'], '상해사망': ['inj_death'], '교통상해사망': ['traffic_death'],
    '질병수술': ['dis_surg'], '상해수술': ['inj_surg'], '질병종수술': ['dis_major'], '상해종수술': ['inj_major'],
    '간병인지원질병입원일당': ['cg_dis_ex'], '간병인지원상해입원일당': ['cg_inj_ex'],
    '질병간호·간병통합서비스사용일당': ['nurse_dis'], '상해간호·간병통합서비스사용일당': ['nurse_inj'],
    '골절진단': ['fracture'], '가족일상생활배상책임': ['liability']
  };

  // M보장분석(계약 상세 없음) 담보별 합계표의 항목명 → 모델 항목 (정확히 일치하는 이름만)
  var MSUM_MAP = {
    '질병사망': ['dis_death'], '상해사망': ['inj_death'],
    '일반암진단비': ['cancer_dx'], '유사암진단비': ['minor_cancer'], '암수술비': ['cancer_surgery'],
    '고액항암치료비(표적)': ['targeted'], '중입자방사선치료비': ['heavy'],
    '뇌혈관진단비': ['brain_dx'], '뇌혈관수술비': ['brain_surg'],
    '허혈성심장질환진단비': ['heart_dx'], '허혈심장질환수술비': ['heart_surg'], '허혈성심장질환수술비': ['heart_surg'],
    '질병수술비': ['dis_surg'], '상해수술비': ['inj_surg'], '질병종수술': ['dis_major'], '상해종수술': ['inj_major'],
    '골절진단비': ['fracture'],
    '암주요치료비': ['cancer_surgery', 'chemo_drug', 'chemo_radio'],
    '질병간병인사용입원일당': ['cg_dis_ex'], '상해간병인사용입원일당': ['cg_inj_ex'],
    '질병간병인지원입원일당': ['cg_dis_ex'], '상해간병인지원입원일당': ['cg_inj_ex'],
    '일상생활배상책임': ['liability'],
    '질병입원': ['dis_indem'], '상해입원': ['inj_indem']
  };

  function classifyRow(name, kind, assign) {
    var n = norm(name);
    if (assign && Object.prototype.hasOwnProperty.call(assign, n)) return assign[n] ? [assign[n]] : [];
    if (kind === 'Msum') return MSUM_MAP[n] || [];
    if (kind === 'xlsx' && XLSX_MAP[n]) return XLSX_MAP[n];
    return classify(name);
  }

  /* ---------- 파일 이름에서 고객명·날짜 ---------- */
  function fromFileName(fn) {
    var out = { name: '', date: '' };
    var s = String(fn || '').replace(/\.[^.]+$/, '');
    var m = s.match(/([가-힣A-Za-zOＯ○*]{2,5})님/);
    if (m) out.name = m[1].replace(/＊/g, '*');
    var d = s.match(/(20\d{2})[-._]?(\d{2})[-._]?(\d{2})/);
    if (d) out.date = d[1] + '-' + d[2] + '-' + d[3];
    else { d = s.match(/(?:^|[^\d])(\d{2})(\d{2})(\d{2})(?:[^\d]|$)/); if (d) out.date = '20' + d[1] + '-' + d[2] + '-' + d[3]; }
    return out;
  }

  function cycleText(cyc, term) {
    cyc = String(cyc || '').trim(); term = String(term || '').trim();
    if (/참조/.test(cyc)) cyc = '';
    if (/참조/.test(term)) term = '';
    if (/^월납$/.test(cyc)) cyc = '매월납';
    term = term.replace(/납$/, '');
    if (/일시납/.test(cyc)) return '일시납';
    if (cyc && term) return cyc + '/' + term;
    return cyc || term || '';
  }

  /* ---------- 엑셀(보장진단) 파서 ---------- */
  function parseXlsx(rows, fileName) {
    var hi = -1, i, j;
    for (i = 0; i < rows.length; i++) {
      if (norm(rows[i] && rows[i][0]) === '보장구분' && norm(rows[i][1]) === '주요특약') { hi = i; break; }
    }
    if (hi < 0) throw new Error('엑셀 형식을 알아볼 수 없어요. (\'보장구분 / 주요특약\' 머리글이 있는 보장진단 엑셀이 필요해요)');
    var head = rows[hi], contracts = [];
    for (j = 6; j < head.length; j++) {
      var company = String(head[j] == null ? '' : head[j]).trim();
      if (!company) continue;
      var prem = String((rows[hi + 3] || [])[j] == null ? '' : (rows[hi + 3] || [])[j]);
      var pm = prem.match(/([\d,]+)\s*원/), cm = prem.match(/\(([^)]*)\)/);
      contracts.push({
        col: j, company: company,
        product: String((rows[hi + 1] || [])[j] == null ? '' : (rows[hi + 1] || [])[j]).trim(),
        renew: String((rows[hi + 2] || [])[j] == null ? '' : (rows[hi + 2] || [])[j]).trim(),
        premium: pm ? parseInt(pm[1].replace(/,/g, ''), 10) : null,
        cycle: cm ? cm[1].trim() : '',
        rows: []
      });
    }
    if (!contracts.length) throw new Error('계약(보험사) 열을 찾지 못했어요.');
    var supports = {}, warnings = [], hasData = false;
    for (i = hi + 1; i < rows.length; i++) {
      var r = rows[i] || [];
      var nm = String(r[1] == null ? '' : r[1]).trim();
      if (!nm) continue;
      hasData = true;
      var keys = classifyRow(nm, 'xlsx', null);
      keys.forEach(function (k) { supports[k] = 1; });
      var sum = 0;
      contracts.forEach(function (c) {
        var a = parseAmt(r[c.col]);
        if (a == null) { warnings.push('금액을 읽지 못한 칸: "' + nm + '" / ' + c.company + ' = ' + r[c.col]); a = 0; }
        sum += a;
        c.rows.push({ name: nm, amt: a });
      });
      var tot = parseAmt(r[4]);
      if (keys.length && tot != null && Math.abs(tot - sum) > 0.5) warnings.push('"' + nm + '": 원본 총액(' + fmtMan(tot) + ')과 계약별 합(' + fmtMan(sum) + ')이 달라요');
    }
    if (!hasData) throw new Error('항목 행을 찾지 못했어요.');
    var fn = fromFileName(fileName);
    return { kind: 'xlsx', label: '엑셀 보장진단', fileName: fileName, customer: fn.name, date: fn.date, contracts: contracts, supports: Object.keys(supports), warnings: warnings };
  }

  /* ---------- PDF 공통: 텍스트 조각 도우미 ---------- */
  function pageText(p) { return p.items.map(function (i) { return i.s; }).join(' '); }
  function byYX(a, b) { return (Math.abs(a.y - b.y) > 2 ? a.y - b.y : a.x - b.x); }
  function joinItems(list) { return list.slice().sort(byYX).map(function (i) { return i.s; }).join(''); }
  function nearestAnchor(anchors, y) {
    var best = -1, bd = 1e9;
    for (var i = 0; i < anchors.length; i++) { var d = Math.abs(anchors[i].y - y); if (d < bd) { bd = d; best = i; } }
    return { idx: best, dist: bd };
  }

  /* ---------- S보장분석(삼성화재) PDF ---------- */
  function parseSPages(pages, fileName) {
    var contracts = [], byKey = {}, warnings = [], cover = { customer: '', date: '' };
    pages.forEach(function (p) {
      var text = pageText(p);
      var mm;
      if (!cover.customer && (mm = text.match(/([가-힣A-Za-z*O]{2,5})\s*님의\s*전체\s*보험\s*현황/))) cover.customer = mm[1];
      if (!cover.date && /전체\s*보험\s*현황/.test(text) && (mm = text.match(/(\d{4})-(\d{2})-(\d{2})\s+\d{2}:\d{2}:\d{2}/))) cover.date = mm[1] + '-' + mm[2] + '-' + mm[3];
      if (!/상품별\s*상세\s*현황/.test(text)) return;

      var its = p.items;
      var comp = its.filter(function (i) { return i.y > 110 && i.y < 148 && i.x < 120; }).sort(byYX)[0];
      var prod = its.filter(function (i) { return i.y >= 150 && i.y < 178 && i.x < 520; });
      var join = null;
      its.forEach(function (i) { var m = i.s.match(/보험가입일\s*:\s*(\d{4}-\d{2}-\d{2})/); if (m) join = m[1]; });
      var cyc = '', term = '';
      its.forEach(function (i) {
        if (i.x > 300 && i.y > 205 && i.y < 240 && /\/.*\//.test(i.s) && !/납입주기/.test(i.s)) {
          var parts = i.s.split('/').map(function (x) { return x.trim(); });
          cyc = parts[0]; term = parts[1];
        }
      });
      var premium = null;
      its.forEach(function (i) {
        var m = i.s.match(/^([\d,]+)\s*원$/);
        if (m && i.x > 400 && i.y > 238 && i.y < 262) premium = parseInt(m[1].replace(/,/g, ''), 10);
      });
      var company = comp ? comp.s.trim() : '';
      var product = joinItems(prod).trim();
      if (!company || !product) { warnings.push('상품 머리글을 읽지 못한 페이지가 있어요.'); return; }

      var key = [company, product, join, premium, cyc, term].join('|');
      var c = byKey[key];
      if (!c) {
        c = byKey[key] = { company: company, product: product, joinDate: join, premium: premium, cycle: cycleText(cyc, term), renew: '', rows: [] };
        contracts.push(c);
      }
      var hdr = its.filter(function (i) { return i.s.trim() === '구분' && i.x < 130 && i.y > 240; })[0];
      if (!hdr) return;
      var anchors = its.filter(function (i) { return /^(정액|실손)$/.test(i.s.trim()) && i.x < 130 && i.y > hdr.y + 2 && i.y < 765; }).sort(function (a, b) { return a.y - b.y; });
      var cells = anchors.map(function () { return { c2: [], c3: [], c4: [] }; });
      its.forEach(function (i) {
        if (i.y <= hdr.y + 2 || i.y >= 765 || i.x < 130 || !anchors.length) return;
        var na = nearestAnchor(anchors, i.y);
        if (na.idx < 0 || na.dist > 30) return;
        if (i.x < 290) cells[na.idx].c2.push(i);
        else if (i.x < 440) cells[na.idx].c3.push(i);
        else cells[na.idx].c4.push(i);
      });
      anchors.forEach(function (a, idx) {
        var name = joinItems(cells[idx].c2), amtTxt = joinItems(cells[idx].c4);
        var amt = parseAmt(amtTxt);
        if (!name) return;
        if (amt == null) { warnings.push('금액을 읽지 못함: ' + name + ' / ' + amtTxt); amt = 0; }
        c.rows.push({ name: name, amt: amt, type: a.s.trim(), std: joinItems(cells[idx].c3) });
      });
    });
    if (!contracts.length) throw new Error('S보장분석 상품별 상세 페이지를 찾지 못했어요.');
    var fn = fromFileName(fileName);
    return { kind: 'S', label: 'S보장분석 PDF', fileName: fileName, customer: fn.name || cover.customer, date: cover.date || fn.date, contracts: contracts, supports: null, warnings: warnings };
  }

  /* ---------- M보장분석(메리츠화재) PDF ---------- */
  function parseMPages(pages, fileName) {
    var contracts = [], warnings = [], cover = { customer: '', date: '', total: null }, cur = null;
    pages.forEach(function (p, pi) {
      var text = pageText(p), mm;
      if (pi === 0 && (mm = text.match(/(\d{4})\.(\d{2})\.(\d{2})/))) cover.date = mm[1] + '-' + mm[2] + '-' + mm[3];
      if (!cover.customer && (mm = text.match(/([가-힣A-Za-z*O]{2,5})\s*고객님을\s*위한/))) cover.customer = mm[1];
      if (cover.total == null && /간편보장분석/.test(text) && (mm = text.match(/월\s*보험료\s*([\d,]+)\s*원/))) cover.total = parseInt(mm[1].replace(/,/g, ''), 10);
      if (!/상품별\s*보험가입현황/.test(text)) return;

      var its = p.items;
      var isNew = its.some(function (i) { return /계약자\s*\/\s*피보험자/.test(i.s); });
      if (isNew) {
        var comp = its.filter(function (i) { return i.y > 45 && i.y < 68 && i.x < 120; }).sort(byYX);
        var prod = its.filter(function (i) { return i.y >= 70 && i.y < 98 && i.x < 560; });
        var cyc = '', term = '', premium = null;
        its.forEach(function (i) {
          if (i.x > 300 && i.y > 100 && i.y < 124 && /\/.*\//.test(i.s) && !/납입주기/.test(i.s)) {
            var parts = i.s.split('/').map(function (x) { return x.trim(); });
            cyc = parts[0]; term = parts[1];
          }
          var m = i.s.match(/^([\d,]+)\s*원$/);
          if (m && i.x > 450 && i.y > 126 && i.y < 150) premium = parseInt(m[1].replace(/,/g, ''), 10);
        });
        cur = { company: comp.length ? comp[0].s.trim() : '', product: joinItems(prod).trim(), premium: premium, cycle: cycleText(cyc, term), renew: '', rows: [] };
        if (!cur.company || !cur.product) warnings.push('상품 머리글을 읽지 못한 페이지가 있어요. (' + (pi + 1) + '쪽)');
        contracts.push(cur);
      }
      if (!cur) return;

    for (i = 0; i < w * h; i++) { var lum = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; bin[i] = (opts.invert ? lum > 200 : lum < thr) ? 1 : 0; }

    if (kind === 'plan') return renderHtmlToCanvas(planHTML(S.plan));
    if (kind === 'cmp') return renderHtmlToCanvas(cmpHTML(cmpCompute(), currentMeta()));
    var model = currentModel(); if (!model) return Promise.reject(new Error('먼저 파일을 올려주세요.'));
    return renderHtmlToCanvas(reportHTML(model, currentMeta(), false));
  }
  function planFileBase() {
    var src = cur(); var nm = (src && src.name ? maskName(src.name, S.mask) + '님_' : '').replace(/[\\/:*?"<>|]/g, '');
    return nm + '보험정리표_' + ((src && src.dateVal) || todayStr());
  }
  function canvasBlob(canvas) { return new Promise(function (res, rej) { canvas.toBlob(function (b) { b ? res(b) : rej(new Error('이미지를 만들지 못했어요.')); }, 'image/png'); }); }

  function savePng(kind) {
    setMsg('busy', '이미지를 만드는 중…');
    var base = kind === 'plan' ? planFileBase() : (kind === 'cmp' ? planFileBase().replace('보험정리표', '보장개선비교') : fileBase());
    return canvasFor(kind).then(canvasBlob).then(function (blob) {
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = base + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      setMsg('ok', '이미지를 저장했어요. (' + a.download + ')');
    }).catch(function (e) { setMsg('err', '이미지 저장 실패: ' + e.message); });
  }
  function copyPng(kind) {
    if (!(navigator.clipboard && window.ClipboardItem)) { setMsg('err', '이 브라우저에서는 이미지 복사를 지원하지 않아요. “이미지(PNG)로 저장”을 이용해 주세요.'); return Promise.resolve(); }
    setMsg('busy', '이미지를 만드는 중…');
    return canvasFor(kind).then(canvasBlob).then(function (blob) {
      return navigator.clipboard.write([new window.ClipboardItem({ 'image/png': blob })]);
    }).then(function () { setMsg('ok', '이미지를 복사했어요. 카카오톡 대화창에서 붙여넣기(Ctrl+V) 하세요.'); })
      .catch(function (e) { setMsg('err', '이미지 복사 실패: ' + e.message + ' — “이미지(PNG)로 저장”을 이용해 주세요.'); });
  }
  function printReport() {
    var model = currentModel(); if (!model) return;
    var css = ($('cv_style') || {}).textContent || '';
    var w = window.open('', '_blank');
    if (!w) { setMsg('err', '팝업이 차단됐어요. 주소창 옆에서 팝업을 허용해 주세요.'); return; }
    w.document.write('<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>' + esc(fileBase()) + '</title><style>' + css +
      '@page{size:A4;margin:0}html,body{margin:0;background:#fff}.cvr{margin:0 auto}</style></head><body>' + reportHTML(model, currentMeta(), false) +
      '<script>window.onload=function(){var r=document.querySelector(".cvr");var h=r.offsetHeight;if(h>1116){document.body.style.zoom=String(1116/h);}setTimeout(function(){window.focus();window.print();},250);};<\/script></body></html>');
    w.document.close();
  }

  /* ---------- 화면 조작 ---------- */
  function editTotal(k) {
    var src = cur(); if (!src) return;
    var it = C.ITEM_BY_KEY[k];
    var m = lastModel || currentModel();
    var curV = src.override && src.override[k] != null ? src.override[k] : m.totals[k];
    var v = window.prompt('“' + it.label + '” 총 보장금액을 입력하세요.\n예) 5000 (만원 단위) · 5천만 · 1억5000만\n0 은 ‘없음’, 비워두면 자동 계산값을 써요.', curV != null ? String(curV) : '');
    if (v === null) return;
    v = String(v).trim();
    if (v === '') { delete src.override[k]; }
    else {
      var num = /^\d+(\.\d+)?$/.test(v.replace(/,/g, '')) ? parseFloat(v.replace(/,/g, '')) : C.parseAmt(v);
      if (num == null || !isFinite(num) || num < 0) { window.alert('금액을 알아볼 수 없어요. 예) 5000, 5천만, 1억'); return; }
      src.override[k] = num;
    }
    renderAll();
  }

  window.CVUI = {
    pick: function (i) { S.active = i; renderAll(); },
    remove: function (i) { S.sources.splice(i, 1); S.active = S.sources.length ? Math.min(S.active, S.sources.length - 1) : -1; if (S.active < 0 && S.sources.length) S.active = 0; renderAll(); },
    setName: function (v) { var s = cur(); if (s) { s.name = v; renderReport(); } },
    setDate: function (v) { var s = cur(); if (s) { s.dateVal = v; renderReport(); } },
    setAd: function (k, v) { S[k] = v; lsSet(k === 'adName' ? 'cv_adname' : 'cv_adtel', v); renderReport(); },
    setMask: function (on) { S.mask = !!on; lsSet('cv_mask', S.mask); renderReport(); },
    setRec: function (el) {
      var k = el.getAttribute('data-k'), v = parseFloat(el.value);
      if (el.value === '' || !isFinite(v) || v < 0) delete S.rec[k]; else S.rec[k] = v;
      lsSet('cv_rec', S.rec);
      lastModel = currentModel(); renderWarn(lastModel); renderReport(); cmpPreview();
    },
    resetRec: function () { S.rec = {}; lsSet('cv_rec', S.rec); renderAll(); },
    assignRow: function (ui, key) {
      if (!key || !lastModel || !lastModel.unmapped[ui]) return;
      S.assign[lastModel.unmapped[ui].n] = key; lsSet('cv_assign', S.assign); renderAll();
    },
    resetAssign: function () { S.assign = {}; lsSet('cv_assign', S.assign); renderAll(); },
    editTotal: editTotal,
    savePng: function () { return savePng('report'); }, copyPng: function () { return copyPng('report'); }, printReport: printReport,
    savePlanPng: function () { return savePng('plan'); }, copyPlanPng: function () { return copyPng('plan'); },
    saveCmpPng: function () { return savePng('cmp'); }, copyCmpPng: function () { return copyPng('cmp'); },
    planSet: function (list, i, f, v) {
      var r = S.plan[list] && S.plan[list][i]; if (!r) return;
      if (f === 'name') r.name = v; else if (f === 'prem') r.prem = digits(v); else if (f === 'convPrem') r.convPrem = digits(v);
      planUpdate();
      if (f === 'name' && (list === 'repl' || list === 'drop')) cmpRebuild();
    },
    planFmt: function (el) { var n = digits(el.value); el.value = n > 0 ? n.toLocaleString('en-US') : ''; },
    planAdd: function (list) {
      S.plan[list].push({ name: '', prem: 0, conv: false, convPrem: 0 });
      var f = $('cv_plan_form'); if (f) f.innerHTML = planFormHTML();
      planUpdate();
      var boxes = document.querySelectorAll('#cv_plan_form .cv-plan-box'), idx = { keep: 0, drop: 1, repl: 2 }[list];
      var ins = boxes[idx] && boxes[idx].querySelectorAll('input.nm'); if (ins && ins.length) ins[ins.length - 1].focus();
      cmpRebuild();
    },
    planDel: function (list, i) { S.plan[list].splice(i, 1); var f = $('cv_plan_form'); if (f) f.innerHTML = planFormHTML(); planUpdate(); cmpRebuild(); },
    planConv: function (i, on) { var r = S.plan.drop[i]; if (!r) return; r.conv = !!on; var f = $('cv_plan_form'); if (f) f.innerHTML = planFormHTML(); planUpdate(); },
    planNote: function (field, v) { S.plan[field] = v; planUpdate(); },
    cSet: function (ri, k, v, el) {
      var r = S.plan.repl[ri]; if (!r) return;
      if (!r.vals) r.vals = {};
      if (String(v).trim() === '') { delete r.vals[k]; if (el) el.classList.remove('bad'); }
      else { var n = parseInputMan(v); if (n == null) { if (el) el.classList.add('bad'); return; } r.vals[k] = n; if (el) el.classList.remove('bad'); }
      cmpRefresh(k);
    },
    cFmt: function (el) {
      var r = S.plan.repl[parseInt(el.getAttribute('data-r'), 10)], k = el.getAttribute('data-k'); if (!r) return;
      var v = r.vals && r.vals[k]; el.value = v == null ? '' : (v === 0 ? '0' : C.fmtMan(v)); el.classList.remove('bad');
    },
    mAdd: function () {
      var src = cur(); if (!src || !src.manual) return;
      src.manual.contracts.push({ id: ++S.mid, company: '', product: '', premium: 0, cycle: '', vals: {} });
      manualRebuild();
      var ins = document.querySelectorAll('#cv_manual_form .cv-mt tr.inf:first-child input');
      if (ins.length) ins[ins.length - 1].focus();
    },
    mDel: function (i) { var src = cur(); if (!src || !src.manual) return; src.manual.contracts.splice(i, 1); manualRebuild(); },
    mInfo: function (i, f, v) {
      var src = cur(), c = src && src.manual && src.manual.contracts[i]; if (!c) return;
      if (f === 'premium') c.premium = digits(v); else c[f] = v;
      manualRefresh(null);
    },
    mSet: function (i, k, v, el) {
      var src = cur(), c = src && src.manual && src.manual.contracts[i]; if (!c) return;
      if (String(v).trim() === '') { delete c.vals[k]; if (el) el.classList.remove('bad'); }
      else {
        var n = parseInputMan(v);
        if (n == null) { if (el) el.classList.add('bad'); return; }
        c.vals[k] = n; if (el) el.classList.remove('bad');
      }
      manualRefresh(k);
    },
    mFmt: function (el) {
      var src = cur(), i = parseInt(el.getAttribute('data-c'), 10), k = el.getAttribute('data-k');
      var c = src && src.manual && src.manual.contracts[i]; if (!c) return;
      var v = c.vals[k]; el.value = v == null ? '' : (v === 0 ? '0' : C.fmtMan(v)); el.classList.remove('bad');
    },
    mClear: function () {
      var src = cur(); if (!src || !src.manual) return;
      if (!window.confirm('직접 입력한 회사별 내용을 모두 비울까요? (리포트는 담보별 합계만 나오게 돼요)')) return;
      src.manual.contracts = []; manualRebuild();
    },
    planFromContract: function (ci, list) {
      var c = lastModel && lastModel.contracts[ci]; if (!c) return;
      S.plan[list].push({ name: (c.company + ' ' + planName(c.product)).trim(), prem: c.premium || 0, conv: false, convPrem: 0, link: { src: S.active, cid: c.id } });
      var f = $('cv_plan_form'); if (f) f.innerHTML = planFormHTML(); planUpdate(); cmpRebuild();
    },
    planReset: function () {
      if (!window.confirm('보험 정리 표의 내용을 모두 비울까요?')) return;
      S.plan = { keep: [], drop: [], repl: [], baseNote: '(종신보험·납입완료건 제외)', endNote: '' };
      renderExtras(lastModel);
    },
    setLogo: function (idx, input) {
      var file = input.files && input.files[0]; if (!file) return;
      var comps = Object.keys((function () { var o = {}; (lastModel ? lastModel.contracts : []).forEach(function (c) { o[c.company] = 1; }); return o; })());
      var cn = comps[idx]; if (!cn) return;
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var mw = 320, sc = Math.min(1, mw / img.width);
          var cv = document.createElement('canvas'); cv.width = Math.max(1, Math.round(img.width * sc)); cv.height = Math.max(1, Math.round(img.height * sc));
          var ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
          S.logos[C.norm(cn)] = cv.toDataURL('image/png'); lsSet('cv_logos', S.logos); renderAll();
        };
        img.onerror = function () { setMsg('err', '이미지를 읽지 못했어요.'); };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    },
    clearLogo: function (idx) {
      var comps = Object.keys((function () { var o = {}; (lastModel ? lastModel.contracts : []).forEach(function (c) { o[c.company] = 1; }); return o; })());
      var cn = comps[idx]; if (!cn) return;
      delete S.logos[C.norm(cn)]; lsSet('cv_logos', S.logos); renderAll();
    },
    state: function () { return S; },
    load: handleFiles
  };

  /* ---------- 초기 연결 ---------- */
  function init() {
    var panel = $('panel-coverage'), drop = $('cv_drop'), input = $('cv_file');
    if (!panel || !drop || !input) return;
    drop.addEventListener('click', function () { input.click(); });
    input.addEventListener('change', function () { handleFiles(input.files).then(function () { input.value = ''; }); });
    ['dragenter', 'dragover'].forEach(function (ev) {
      panel.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
    });
    ['dragleave', 'drop'].forEach(function (ev) {
      panel.addEventListener(ev, function (e) { e.preventDefault(); if (ev === 'drop' || e.target === drop || e.target === panel) drop.classList.remove('over'); });
    });
    panel.addEventListener('drop', function (e) { drop.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files); });
    panel.addEventListener('toggle', function (e) { var t = e.target; var id = t && t.getAttribute && t.getAttribute('data-id'); if (!id) return; if (id === 'plan' && !cur()) return; S.open[id] = t.open; if (t.open) setTimeout(fit, 0); }, true);
    $('cv_report').addEventListener('click', function (e) {
      var td = e.target.closest ? e.target.closest('td.tot') : null;
      if (td && td.getAttribute('data-k')) editTotal(td.getAttribute('data-k'));
    });
    window.addEventListener('resize', fit);
    var tabBtn = document.querySelector('.tabbtn[data-tab="coverage"]');
    if (tabBtn) tabBtn.addEventListener('click', function () { setTimeout(fit, 0); });
    renderAll();
  }
  init();
})();

</script>
</body></html>
