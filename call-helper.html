<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>통화 도우미</title>
<style>
:root{--navy:#0A1628;--mid:#1A3A5C;--blue:#4A90D9;--lb:#EBF3FB;--line:#D5DCE6;--bg:#F2F4F7;--ok:#1E8E5A;--warn:#C0392B;--ink:#1c2430;--muted:#5b6778}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"맑은 고딕","Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding:0 12px 60px}
header{background:var(--navy);color:#fff;padding:14px 16px;margin:0 0 12px}
header .in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header h1{margin:0;font-size:19px}
header .badge{background:var(--blue);color:#fff;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:700}
header p{margin:0;width:100%;font-size:12.5px;color:#b9c8dc}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.lab{font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:0 1 auto;min-width:64px;padding:9px 12px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;color:#2b3a4f}
.seg button:hover{border-color:var(--blue)}
.seg button.on{background:var(--mid);color:#fff;border-color:var(--mid);font-weight:700}
.seg.sub button.on{background:var(--blue);border-color:var(--blue)}
.ctlrow{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;align-items:flex-end}
.ctlrow>div{min-width:0}
.trait{margin-top:10px;background:var(--lb);border-radius:8px;padding:8px 12px;font-size:13.5px;color:var(--mid)}
.trait b{color:var(--navy)}
details.info{margin-top:10px}
details.info>summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--mid)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.grid label{display:block;font-size:12px;color:var(--muted);font-weight:700}
.grid input,.grid select{width:100%;margin-top:3px;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;background:#fff}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:12px;align-items:start}
@media(max-width:900px){.cols{grid-template-columns:1fr}.side{position:static!important;max-height:none!important}}
.side{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto}
.flow{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.flow button{flex:1 1 120px;padding:9px 6px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:13.5px;font-weight:700;color:var(--muted);cursor:pointer}
.flow button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.flow button.done{background:var(--lb);color:var(--mid)}
.stt{margin:0 0 8px;font-size:17px;font-weight:800;color:var(--navy)}
.stt small{font-size:12.5px;font-weight:400;color:var(--muted);margin-left:6px}
.line{display:flex;gap:8px;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--line)}
.line:first-of-type{border-top:none}
.line .n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:3px}
.line .b{flex:1;min-width:0}
.ltxt{font-size:16px;line-height:1.75;word-break:keep-all}
.cue{margin-top:3px;font-size:12.5px;color:var(--ok);font-weight:700}
.cue.w{color:var(--warn)}
.cp{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:6px;font:inherit;font-size:11.5px;padding:3px 9px;cursor:pointer;color:#46515f}
.cp.done{background:var(--ok);color:#fff;border-color:var(--ok)}
mark.ph{background:#FFF1B8;color:#7a5b00;padding:0 2px;border-radius:3px}
b.v{background:#DDF3E8;color:#14633f;padding:0 2px;border-radius:3px;font-weight:700}
.big .ltxt{font-size:21px;line-height:1.85}
.brief{margin:0 0 8px;padding-left:20px;font-size:15.5px}
.brief li{margin:3px 0}
details.more{margin-top:8px;border:1px solid var(--line);border-radius:8px;background:#FAFBFC}
details.more>summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:700;color:var(--mid)}
details.more>.in{padding:0 12px 8px}
.qcard{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0;background:#fff}
.qcard.note{background:#FFFBEA;border-color:#EBD98A}
.qcard.warn{background:#FDF0EE;border-color:#E9B2AA}
.qcard .tag{font-size:11.5px;font-weight:800;color:var(--blue);margin-bottom:2px}
.qcard.note .tag{color:#8a6a00}
.qcard.warn .tag{color:var(--warn)}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.btn{padding:10px 16px;border:1px solid var(--mid);background:var(--mid);color:#fff;border-radius:8px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--mid)}
.btn:disabled{opacity:.35;cursor:default}
.side h3{margin:0 0 6px;font-size:15px;color:var(--navy)}
.ogrp{margin:8px 0 4px;font-size:12px;font-weight:800;color:var(--muted)}
.obtns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.obtns button{padding:9px 8px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-size:13.5px;cursor:pointer;text-align:left;color:#2b3a4f;line-height:1.35}
.obtns button:hover{border-color:var(--blue)}
.obtns button.on{background:var(--lb);border-color:var(--blue);color:var(--navy);font-weight:700}
.obtns.main button{font-weight:700;padding:11px 8px}
.odet{margin-top:12px;border-top:2px solid var(--blue);padding-top:10px}
.odet h4{margin:0 0 6px;font-size:15.5px;color:var(--navy)}
.say{background:#F5F3ED;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-bottom:6px}
.lbl{display:inline-block;font-size:11.5px;font-weight:800;color:#fff;background:var(--blue);border-radius:10px;padding:1px 8px;margin-right:6px}
.lbl.b2{background:var(--mid)}.lbl.b3{background:var(--ok)}.lbl.b4{background:#7a8594}
.tip{margin-top:6px;font-size:12.5px;color:var(--ok);font-weight:700}
.peer{margin-top:8px;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;background:#FAFBFC;font-size:13.5px}
.peer .t{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:3px}
textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:14px;resize:vertical}
.pbub{background:#F5F3ED;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:18px;line-height:1.6}
.pmeta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--lb);color:var(--mid);border-radius:14px;padding:3px 10px;font-size:12.5px}
.chip.g{background:#EEF0F3;color:#46515f}
.chk{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;font-size:14px;cursor:pointer}
.chk input{margin-top:5px;width:auto}
.stat{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.stat div{background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px}
.stat b{font-size:17px;color:var(--navy)}
.hide{display:none!important}
.foot{font-size:12px;color:var(--muted);margin-top:14px}
.popts{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.popt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-size:15px;line-height:1.55;cursor:pointer;color:var(--ink);word-break:keep-all}
.popt:hover:not(:disabled){border-color:var(--blue);background:var(--lb)}
.popt .pn{flex:0 0 22px;height:22px;border-radius:50%;background:var(--bg);color:var(--mid);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px}
.popt:disabled{cursor:default}
.popt.b{background:#E8F6EE;border-color:#9AD5B4}
.popt.a{background:#FFF8E1;border-color:#EBD98A}
.popt.x{background:#FDF0EE;border-color:#E9B2AA}
.popt.sel{outline:3px solid var(--navy);outline-offset:1px}
.pfb{margin:8px 0;padding:9px 12px;border-radius:8px;font-size:14px}
.pfb.b{background:#E8F6EE;color:#14633f}.pfb.a{background:#FFF8E1;color:#7a5b00}.pfb.x{background:#FDF0EE;color:var(--warn)}

html{font-size:17px}
body{font-size:1.06rem}
.topbar{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.topbar .chip{font-size:14px;padding:5px 12px}
.topbar .sp{flex:1}
.tb{padding:10px 16px;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-size:15px;font-weight:700;color:var(--mid);cursor:pointer}
.hq{font-size:1.5rem;font-weight:800;color:var(--navy);margin:6px 0 4px}
.hs{font-size:.95rem;color:var(--muted);margin:0 0 14px}
.bigcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.bigcards{grid-template-columns:1fr}}
.bc{display:block;width:100%;text-align:left;padding:20px 18px;border:2px solid var(--line);background:#fff;border-radius:14px;font:inherit;cursor:pointer;color:var(--ink)}
.bc:hover{border-color:var(--blue);background:var(--lb)}
.bc b{display:block;font-size:1.3rem;color:var(--navy);margin-bottom:4px}
.bc span{font-size:1rem;color:var(--muted);line-height:1.5}
.bc.dark{background:var(--navy);border-color:var(--navy)}.bc.dark b,.bc.dark span{color:#fff}
.cols{grid-template-columns:1fr!important}
.side{position:static!important;max-height:none!important}
.ltxt{font-size:1.25rem!important;line-height:1.85}
.callhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.prog{flex:1;min-width:160px}
.prog .bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--blue)}
.prog .tx{font-size:.95rem;font-weight:800;color:var(--navy);margin-bottom:3px}
.objbtn{width:100%;margin-top:12px;padding:16px;font-size:1.1rem;background:#fff;color:var(--navy);border:2px solid var(--blue)}
.sheetbg{position:fixed;inset:0;background:rgba(10,22,40,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:82vh;overflow:auto;background:#fff;z-index:21;border-radius:16px 16px 0 0;padding:14px 16px 24px;box-shadow:0 -6px 24px rgba(0,0,0,.25);max-width:760px;margin:0 auto}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.popt{font-size:1.1rem}
.pbub{font-size:1.25rem}
.btn{font-size:1.05rem;padding:13px 20px}
.nav .btn{min-width:110px}
.tb.on{background:var(--mid);color:#fff;border-color:var(--mid)}
</style>
</head>
<body>
<header><div class="in"><h1>📞 통화 도우미</h1></div></header>
<div class="wrap" id="root">
  <div class="topbar" id="topbar"></div>
  <div id="main"></div>
  <details class="info" id="infobox" style="margin-top:12px">
    <summary>고객·내 이름 넣기 (선택 · 멘트에 자동으로 들어갑니다)</summary>
    <div class="grid">
      <div><label for="in_cust">고객 이름</label><input id="in_cust" placeholder="예: 홍길동"></div>
      <div><label for="in_honor">호칭</label><select id="in_honor"><option value="auto">자동(고객 연령대)</option><option value="선생님">선생님</option><option value="고객님">고객님</option><option value="사모님">사모님</option></select></div>
      <div><label for="in_me">내 이름</label><input id="in_me" placeholder="예: 김팀장"></div>
      <div><label for="in_prem">월 보험료(선택)</label><input id="in_prem" placeholder="예: 20만 원"></div>
      <div><label for="in_birth">생년월일 6자리(선택)</label><input id="in_birth" inputmode="numeric" maxlength="6" placeholder="예: 710917"></div>
    </div>
    <div class="note">내 이름과 호칭만 이 PC에 저장됩니다. 고객 정보는 저장하지 않고 화면을 닫으면 사라집니다.</div>
  </details>
  <div class="foot">멘트 속 노란 부분은 상황에 맞게 채워서 말하는 자리입니다.</div>
</div>

<script>
(function(){
'use strict';

/* ---------- 저장(내 이름·호칭·연습 기록·내 멘트) ---------- */
var LS_KEY='ctool_v1';
function lsGet(){try{var r=window.localStorage.getItem(LS_KEY);return r?JSON.parse(r):{};}catch(e){return {};}}
function lsSet(o){try{window.localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){}}
var store=lsGet();
if(!store||typeof store!=='object')store={};
if(!Array.isArray(store.recs))store.recs=[];
if(!store.mine||typeof store.mine!=='object')store.mine={};
if(!Array.isArray(store.pat))store.pat=[];

/* ---------- 공통 블록 ---------- */
var INFO=[
 {t:'성함 {고객 이름} 맞으시죠? → 전화번호 맞으시죠? → 생년월일 {생년} 맞으시죠?',cue:'세 번 모두 “네”를 받는 게 목표입니다. 앞에서 “네”를 반복하면 뒤에서도 거절이 줄어듭니다.'},
 {t:'정확한 확인을 위해 뒷자리까지 말씀해 주시겠어요?'},
 {t:'(거절하면 ①) 보험도 금융상품이라 본인 확인이 필수예요. 확인 목적으로만 쓰이고, 분석이 끝나면 가입하신 보험 리포트도 함께 보내드릴 수 있어요.'},
 {t:'(거절하면 ②, 어르신 제외) 걱정되시면 제가 본인확인 알림톡을 보내드릴 테니 직접 인증해 주세요. 그러면 불필요한 절차도 줄어들어요.'}
];
var HEALTH=[
 {t:'정확하지 않아도 괜찮고, 기억나는 범위로만 말씀 주시면 됩니다.',cue:'병력 질문 전에 이 말을 먼저 해서 부담을 낮춥니다.'},
 {t:'최근 3개월 이내에 병원에서 진찰이나 검사 받으신 적 있으실까요?'},
 {t:'지금 혈압약, 당뇨약, 고지혈증 약 포함해서 꾸준히 드시는 약 있으실까요?'},
 {t:'최근 5년(또는 10년) 이내에 입원이나 수술 받으신 거 기억나시는 게 있으실까요?'},
 {t:'(있을 때만) 병명 / 치료 시기(대략) / 치료 기간 / 수술 여부 / 치료 부위(좌우)',cue:'답마다 “네, 그러셨군요” 하고 호응합니다.'},
 {t:'현재 하시는 일은 어떻게 되실까요? (직업에 따라 보험료가 달라요) 운전은 하시나요? 자가용인가요, 영업용인가요?'}
];
var CLOSE_FIX={t:'정리된 내용은 카톡으로 바로 보내드릴게요. {시간선택} 그 시간에 다시 연락드려도 될까요?',cue:'“언제 한번”이 아니라 시간까지 확정하고, 바로 예약으로 기록합니다.'};
function mkClose(choice){
 return [
  {t:'아까 {고객 걱정} 부분이 제일 걱정이라고 하셨는데, 이번 설계는 그 부분을 먼저 채우는 쪽으로 잡았어요.',cue:'고객이 통화 중에 한 말을 그대로 인용합니다.'},
  {t:choice,cue:'“할래요/안 할래요”가 아니라 A·B 중에서 고르게 묻습니다.'},
  CLOSE_FIX
 ];
}
function mkCompare(criteria){
 return [
  {t:'먼저 지금 가지고 계신 보험부터 정리해 드릴게요. 잘 되어 있는 부분은 {잘된 점}이고, 부족하거나 겹치는 부분은 {부족한 점}입니다.',warn:'기존에 가입한 보험을 절대 흉보지 않습니다. 잘된 점을 먼저 말합니다.'},
  {t:'같은 보장도 보험사마다 조건이 달라서 세 곳을 나란히 놓고 보여드릴게요. 비교는 '+criteria+' 이 순서로 보시면 됩니다.',cue:'비교표나 화면을 보면서 하나씩 짚습니다.'},
  {t:'그중 {추천 보험사}를 먼저 말씀드리는 이유는 {이유 1}, {이유 2} 때문이에요. 고객님이 말씀하신 {고객 걱정} 부분에 맞는 쪽이라서요.',cue:'추천 이유는 고객이 한 말과 연결합니다.'},
  {t:'다만 {단점} 부분은 감안하셔야 해요. 이런 점까지 같이 말씀드려야 나중에 후회가 없으세요.',cue:'단점을 먼저 솔직하게 말하면 신뢰가 올라갑니다.'},
  {t:'기존 보험을 바꾸거나 해지하시는 경우에는 환급금, 보장 공백, 면책·감액 재적용 같은 불이익이 생길 수 있어서 그 부분도 먼저 설명드릴게요.',warn:'기존 보험 해지를 먼저 권하지 않습니다. 불이익을 먼저 설명합니다.'}
 ];
}

/* ---------- DB유형 ---------- */
var TYPES=[
{id:'tv',grp:'tv',name:'TV광고',topic:'기존 보험',
 trait:'<b>케이블TV 보험점검 광고</b>를 보고 상담을 예약한 고객입니다. 가입이 아니라 <b>점검</b>을 기대하고 있어서, 가입 권유처럼 들리면 바로 방어합니다.',
 intro:[
  {t:'안녕하세요, {고객} 맞으시죠? 반갑습니다.',cue:'이름 확인으로 첫 “네”를 받습니다.'},

/* 반환: {html, plain} */
function fill(text,profile){
 var T=ctxTokens(profile),html='',plain='',last=0,m,re=/\{([^}]+)\}/g;
 while((m=re.exec(text))!==null){
  var pre=text.slice(last,m.index);
  html+=esc(pre);plain+=pre;
  var v=T[m[1]];
  if(v===undefined){html+='<mark class="ph">'+esc(m[1])+'</mark>';plain+=m[1];}
  else if(v.charAt(0)==='V'){html+='<b class="v">'+esc(v.slice(2))+'</b>';plain+=v.slice(2);}
  else{html+='<mark class="ph">'+esc(v.slice(2))+'</mark>';plain+=v.slice(2);}
  last=m.index+m[0].length;
 }
 var rest=text.slice(last);
 html+=esc(rest);plain+=rest;
 return {html:html,plain:plain};
}
function cpBtn(plain){return '<button class="cp" data-act="copy" data-i="'+reg(plain)+'">복사</button>';}

 return '<div class="line">'+n+'<div class="b"><div class="ltxt">'+f.html+'</div>'+cue+'</div>'+cpBtn(f.plain)+'</div>';
}

 {st:'talk',c:'예전에 아는 사람이 권해서 가입했어요.',g:'문제 제시 → “돈 더 내라가 아니라 빼서 옮기자”',

 {st:'talk',c:'실손은 안 바꿀 거예요. 4세대로 갈아타라는 거죠?',g:'반론 사전 차단',

var PAT_STAGES={intro:'도입부',talk:'소통·질문',compare:'설계 후 비교·추천이유',close:'클로징'};
/* ---------- 체결 콜 패턴 연습 ---------- */
var PAT_PT={b:2,a:1,x:0};
var PAT_LAB={b:'좋은 선택',a:'무난하지만 아쉬워요',x:'피하세요'};
function patGroup(){var g=typeById(S.type).grp;return PAT[g]?g:'tv';}
function patList(){return PAT[patGroup()];}
function patScn(){var l=patList();for(var i=0;i<l.length;i++){if(l[i].id===S.pt.sid)return l[i];}return l[0];}
function patTurns(sc){return sc.turns.filter(function(t){return !(S.level==='exp'&&t.lv==='new');});}
function effSt(t){return (S.level==='exp'&&t.st==='compare')?'close':t.st;}
function patNew(sid){S.pt={sid:sid,i:0,picks:[],order:[],view:'play',saved:false,mode:'read'};}
function shuffle3(){var a=[0,1,2],i,j,t;for(i=2;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function patOrder(i){if(!S.pt.order[i])S.pt.order[i]=shuffle3();return S.pt.order[i];}
function bestOf(t){for(var i=0;i<t.o.length;i++){if(t.o[i][0]==='b')return t.o[i];}return t.o[0];}
function patPoints(turns){var p=0,i;for(i=0;i<turns.length;i++){var k=S.pt.picks[i];if(k!==undefined)p+=PAT_PT[turns[i].o[k][0]];}return p;}
function patStats(){
 var recs=store.pat||[],td=todayStr();
 var today=recs.filter(function(r){return r.d===td;});
 var avg=today.length?Math.round(today.reduce(function(a,r){return a+r.p/r.m*100;},0)/today.length):0;
 var recent=recs.slice(-5).reverse().map(function(r){return '<li>'+esc(r.d)+' · '+esc(r.n)+' · '+Math.round(r.p/r.m*100)+'점</li>';}).join('');
 return '<div class="stat"><div>오늘 연습 <b>'+today.length+'</b>회</div><div>오늘 평균 <b>'+(today.length?avg:'-')+'</b>점</div><div>누적 <b>'+recs.length+'</b>회</div></div>'+(recent?'<ul class="brief" style="margin-top:8px;font-size:13px;color:var(--muted)">'+recent+'</ul>':'');
}
function stageBar(cur,finished){
 var steps=stepsFor(),ci=-1,i,h='<div class="flow">';
 for(i=0;i<steps.length;i++){if(steps[i].k===cur)ci=i;}
 for(i=0;i<steps.length;i++){
  var cls=finished?'done':(i===ci?'on':(i<ci?'done':''));
  h+='<button class="'+cls+'" tabindex="-1" style="cursor:default">'+(i+1)+'. '+esc(steps[i].n)+'</button>';
 }
 return h+'</div>';
}
function bestBox(t){
 var b=bestOf(t),f=fill(b[1]);
 return '<div class="line"><div class="b"><span class="lbl b3">모범 흐름</span><span class="ltxt">'+f.html+'</span></div>'+cpBtn(f.plain)+'</div>';
}
function flowHTML(sc,turns){
 var steps=stepsFor(),h='<div class="qcard note"><div class="tag">이 통화의 흐름</div>'+esc(sc.flow)+'</div>';
 steps.forEach(function(s){
  var ts=turns.filter(function(t){return effSt(t)===s.k;});
  if(!ts.length)return;
  h+='<div class="ogrp" style="font-size:13.5px;color:var(--navy)">'+esc(s.n)+'</div>';
  ts.forEach(function(t){
   h+='<div class="qcard"><div class="tag">고객: '+fill(t.c).html+'</div><div class="cue" style="margin:2px 0 4px">목표 · '+fill(t.g).html+'</div>'+bestBox(t)+'<div class="cue" style="color:var(--mid)">실제 체결 콜에서는 · '+esc(t.real)+'</div></div>';
  });
 });
 return h;
}
function renderPattern(){
 var l=patList(),ok=false,i;
 if(S.pt){for(i=0;i<l.length;i++){if(l[i].id===S.pt.sid)ok=true;}}
 if(!ok)patNew(l[0].id);
 var sc=patScn(),turns=patTurns(sc),p=S.pt,n=turns.length,fin=p.i>=n;
 var cur=fin?null:effSt(turns[p.i]);
 var h='<div class="card">';
 if(l.length>1)h+='<div class="seg sub" style="margin-bottom:10px">'+l.map(function(x){return '<button class="'+(x.id===sc.id?'on':'')+'" data-act="scn" data-v="'+x.id+'">'+esc(x.title)+'</button>';}).join('')+'</div>';
 else h+='<div class="note" style="margin:0 0 8px;font-size:14px">'+esc(sc.title)+'</div>';
 if(sc.note)h+='<div class="qcard warn"><div class="tag">알아두기</div>'+esc(sc.note)+'</div>';
 if(p.view==='flow'){
  h+='<div class="nav" style="justify-content:flex-start;margin:0 0 10px"><button class="btn sec" data-act="pview">← 연습으로 돌아가기</button></div>'+flowHTML(sc,turns);
 }else if(p.mode==='read'){
  var rt=turns[p.i],rn=turns.length,rb=bestOf(rt),rf=fill(rb[1]);
  h+='<div class="prog"><div class="tx">따라 읽기 · '+esc(PAT_STAGES[effSt(rt)])+' · '+(p.i+1)+' / '+rn+'</div><div class="bar"><i style="width:'+Math.round(p.i/rn*100)+'%"></i></div></div>';
  h+='<div class="note" style="margin:12px 0 4px">고객이 이렇게 말합니다</div><div class="pbub">“'+fill(rt.c).html+'”</div>';
  h+='<div class="note" style="margin:12px 0 4px">이렇게 대답합니다 (소리 내어 읽어 보세요)</div>';
  h+='<div class="line"><div class="b"><span class="lbl b3">모범 대답</span><span class="ltxt">'+rf.html+'</span></div>'+cpBtn(rf.plain)+'</div>';
  h+='<div class="qcard note"><div class="tag">이 말을 하는 이유</div>'+esc(rb[2])+'</div>';
  if(rt.n)h+='<div class="cue w" style="margin-top:6px">'+esc(rt.n)+'</div>';
  h+='<div class="qcard note"><div class="tag">실제 체결 콜에서는</div>'+esc(rt.real)+'</div>';
  h+='<div class="nav"><button class="btn sec" data-act="rprev" '+(p.i===0?'disabled':'')+'>← 이전</button>'+(p.i+1<rn?'<button class="btn" data-act="rnext">다음 →</button>':'<button class="btn" data-act="rquiz">연습해 보기 →</button>')+'</div>';
  if(p.i+1<rn)h+='<div class="nav" style="justify-content:flex-start;margin-top:4px"><button class="btn sec" data-act="rquiz">바로 연습해 보기</button></div>';
 }else if(!fin){
  var t=turns[p.i],picked=p.picks[p.i],ord=patOrder(p.i);
  h+='<div class="prog"><div class="tx">'+esc(PAT_STAGES[cur])+' · '+(p.i+1)+' / '+n+'</div><div class="bar"><i style="width:'+Math.round(p.i/n*100)+'%"></i></div></div>';
  h+='<div class="note" style="margin:12px 0 4px">고객이 이렇게 말합니다</div>';
  h+='<div class="pbub">“'+fill(t.c).html+'”</div>';
  h+='<div class="note" style="margin:12px 0 4px">어떤 말이 좋을까요? (하나를 눌러 보세요)</div>'+(p.i===0&&picked===undefined?'<div class="cue w" style="margin:0 0 6px">연습용이라 보기 중에는 일부러 <b>틀린 말</b>도 섞여 있습니다. 실제 통화 멘트가 아닙니다.</div>':'')+'<div class="popts">';
  ord.forEach(function(oi,pos){
   var o=t.o[oi],cls='popt';
   if(picked!==undefined)cls+=(oi===picked?' sel':'')+' '+o[0];
   h+='<button class="'+cls+'" data-act="pick" data-v="'+oi+'" '+(picked!==undefined?'disabled':'')+'><span class="pn">'+(pos+1)+'</span><span>'+fill(o[1]).html+'</span></button>';
  });
  h+='</div>';
  if(picked!==undefined){
   var po=t.o[picked];
   h+='<div class="pfb '+po[0]+'" id="pfb"><b>'+esc(PAT_LAB[po[0]])+'</b> · '+esc(po[2])+'</div>';
   if(po[0]!=='b')h+=bestBox(t);
   if(t.n)h+='<div class="cue w" style="margin-top:6px">'+esc(t.n)+'</div>';
   h+='<div class="qcard note"><div class="tag">실제 체결 콜에서는</div>'+esc(t.real)+'</div>';
   h+='<div class="nav"><button class="btn sec" data-act="pview">흐름 보기</button><button class="btn" data-act="pnext">'+(p.i+1>=n?'결과 보기 →':'다음 →')+'</button></div>';
  }else{
   h+='<div class="nav"><button class="btn sec" data-act="pview">이 통화의 흐름 먼저 보기</button><span></span></div>';
  }
 }else{
  var pts=patPoints(turns),mx=n*2,pct=Math.round(pts/mx*100);
  var good=turns.filter(function(tt,ix){return tt.o[p.picks[ix]][0]==='b';}).length;
  h+='<div class="pbub" style="text-align:center"><div style="font-size:.9rem;color:var(--muted)">이번 연습</div><div style="font-size:2.4rem;font-weight:800;color:var(--navy)">'+pct+'점</div><div style="font-size:1rem">'+n+'번 중 좋은 선택 '+good+'번</div></div>';
  var weak=turns.filter(function(tt,ix){return tt.o[p.picks[ix]][0]!=='b';});
  if(weak.length){
   h+='<div class="lab" style="margin-top:14px">다시 보면 좋은 순간</div>';
   weak.forEach(function(tt){h+='<div class="qcard"><div class="tag">고객: '+fill(tt.c).html+'</div>'+bestBox(tt)+'</div>';});
  }
  h+='<div class="nav"><button class="btn sec" data-act="pview">흐름 보기</button><button class="btn" data-act="pagain">다시 하기</button></div>';
 }
 h+='</div>';
 $('main').innerHTML=h;
 if(p.view!=='flow'&&!fin&&p.picks[p.i]!==undefined){var fb=$('pfb');if(fb&&fb.scrollIntoView)fb.scrollIntoView({block:'nearest'});}
}

/* ---------- 화면 ---------- */
function curName(){var t=typeById(S.type);return t.grp==='ad'?t.name:t.name;}
function topbar(){
 var h='';
 if(S.screen!=='home')h+='<button class="tb" data-act="back">← 뒤로</button><button class="tb" data-act="home">처음으로</button>';
 if(S.screen!=='home'&&S.screen!=='product')h+='<span class="chip">'+esc(curName())+'</span>';
 h+='<span class="sp"></span>';
 if(S.screen==='call')h+='<button class="tb '+(S.level==='exp'?'on':'')+'" data-act="lvl">요약만 보기</button>';
 h+='<button class="tb '+(S.big?'on':'')+'" data-act="big">글씨 크게</button>';
 $('topbar').innerHTML=h;
 document.body.classList.toggle('big',S.big);
 $('infobox').classList.toggle('hide',['call','pattern','objp'].indexOf(S.screen)<0);
}
function bigCards(list,act){
 return '<div class="bigcards">'+list.map(function(x){return '<button class="bc" data-act="'+act+'" data-v="'+x[0]+'"><b>'+esc(x[1])+'</b><span>'+esc(x[2])+'</span></button>';}).join('')+'</div>';
}
function renderScreen(){
 var h='',sc=S.screen,t=typeById(S.type);
 if(sc==='home'){
  h='<div class="hq">어떤 고객과 통화하시나요?</div><div class="hs">고객이 들어온 경로를 하나 눌러 주세요.</div>'+bigCards(HOME,'type');
 }else if(sc==='product'){
  h='<div class="hq">어떤 상품 문의인가요?</div><div class="hs">상품만 다르고 통화 흐름은 같습니다.</div>'+bigCards(AD_SUB,'type');
 }else if(sc==='mode'){
  h='<div class="hq">무엇을 하시겠어요?</div><div class="trait" style="margin-bottom:12px">'+t.trait+'</div><div class="bigcards"><button class="bc dark" data-act="go" data-v="call"><b>📞 통화하기</b><span>지금 할 말을 순서대로 보면서 통화합니다</span></button><button class="bc" data-act="go" data-v="pmenu"><b>🎯 연습하기</b><span>체결된 통화의 흐름을 따라가며 연습합니다</span></button></div>';
 }else if(sc==='pmenu'){
  h='<div class="hq">어떤 연습을 할까요?</div><div class="hs">처음이시면 왼쪽부터 해 보세요.</div><div class="bigcards"><button class="bc dark" data-act="go" data-v="pattern"><b>체결 통화 따라가기</b><span>먼저 모범 대화를 읽고, 이어서 어떤 말이 좋은지 골라 보는 연습을 합니다</span></button><button class="bc" data-act="go" data-v="objp"><b>반론 연습</b><span>“필요 없어요” 같은 거절에 대답하는 연습을 합니다</span></button></div>';
 }
 if(h){$('main').innerHTML=h;return;}
 if(sc==='call')renderCall();
 else if(sc==='pattern')renderPattern();
 else renderPractice();
}
function renderCall(){
 var t=typeById(S.type),steps=stepsFor();
 if(S.step>=steps.length)S.step=steps.length-1;
 var st=steps[S.step],h='<div class="card"><div class="callhead"><div class="prog"><div class="tx">'+(S.step+1)+'. '+esc(st.n)+' <span style="font-weight:400;color:var(--muted)">('+(S.step+1)+' / '+steps.length+')</span></div><div class="bar"><i style="width:'+Math.round((S.step+1)/steps.length*100)+'%"></i></div></div></div>';
 h+=stepBody(t,st);
 h+='<div class="nav"><button class="btn sec" data-act="prev" '+(S.step===0?'disabled':'')+'>← 이전</button><button class="btn" data-act="next" '+(S.step===steps.length-1?'disabled':'')+'>다음 →</button></div></div>';
 h+='<button class="btn objbtn" data-act="sheet">💬 고객이 이렇게 말하면?</button>';
 if(S.sheet)h+='<div class="sheetbg" data-act="sheetclose"></div><div class="sheet"><div class="sheethead"><b style="font-size:1.1rem;color:var(--navy)">고객이 이렇게 말하면</b><button class="btn sec" style="padding:8px 14px" data-act="sheetclose">닫기</button></div>'+objPanel(t)+'</div>';
 $('main').innerHTML=h;
}
/* ---------- 렌더 & 이벤트 ---------- */
function render(){topbar();renderScreen();}
function setStore(){lsSet(store);}
function goBack(){
 var sc=S.screen,t=typeById(S.type);
 if(sc==='pattern'||sc==='objp')S.screen='pmenu';
 else if(sc==='call'||sc==='pmenu')S.screen='mode';
 else if(sc==='mode')S.screen=(t.grp==='ad')?'product':'home';
 else S.screen='home';
 S.sheet=false;S.obj=null;
}
document.addEventListener('click',function(ev){
 var el=ev.target;
 while(el&&el!==document&&!(el.getAttribute&&el.getAttribute('data-act')))el=el.parentNode;
 if(!el||el===document)return;
 var act=el.getAttribute('data-act'),v=el.getAttribute('data-v');
 if(act==='type'){
  if(v==='ad'){S.type=lastAd;S.screen='product';}
  else{S.type=v;if(typeById(v).grp==='ad')lastAd=v;S.screen='mode';}
  S.step=0;S.obj=null;S.pr.obj=null;S.pt=null;S.sheet=false;render();
 }
 else if(act==='go'){
  S.screen=v;S.step=0;S.obj=null;S.sheet=false;S.pt=null;S.pr.obj=null;
  if(v==='pattern')S.level='new';
  render();
 }
 else if(act==='back'){goBack();render();}
 else if(act==='home'){S.screen='home';S.sheet=false;S.obj=null;render();}
 else if(act==='lvl'){S.level=(S.level==='exp')?'new':'exp';S.step=0;render();}
 else if(act==='big'){S.big=!S.big;render();}
 else if(act==='prev'){if(S.step>0){S.step--;renderCall();window.scrollTo(0,0);}}
 else if(act==='next'){if(S.step<stepsFor().length-1){S.step++;renderCall();window.scrollTo(0,0);}}
 else if(act==='sheet'){S.sheet=true;renderCall();}
 else if(act==='sheetclose'){S.sheet=false;S.obj=null;renderCall();}
 else if(act==='obj'){
  S.obj=(S.obj===v)?null:v;
  var old=document.querySelector('.sheet'),top=old?old.scrollTop:0;
  renderCall();
  var nw=document.querySelector('.sheet');
  if(nw){nw.scrollTop=top;var d=nw.querySelector('.odet');if(d&&S.obj&&d.scrollIntoView)d.scrollIntoView({block:'nearest',behavior:'smooth'});}
 }
 else if(act==='copy'){
  var txt=COPY[parseInt(el.getAttribute('data-i'),10)]||'';
  var done=function(){el.classList.add('done');el.textContent='복사됨';setTimeout(function(){el.classList.remove('done');el.textContent='복사';},1200);};
  try{
   if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt,done);});}
   else fallbackCopy(txt,done);
  }catch(e){fallbackCopy(txt,done);}
 }
 else if(act==='savemine'){
  var ta=$('mine_'+v);if(ta){var val=ta.value.trim();if(val)store.mine[v]=val;else delete store.mine[v];setStore();el.textContent='저장됨 ✓';setTimeout(function(){el.textContent='저장';},1200);}
 }
 else if(act==='newq'){newQuestion();renderPractice();}
 else if(act==='reveal'){var a=$('pr_ans');if(a)S.pr.answer=a.value;S.pr.revealed=true;renderPractice();}
 else if(act==='chk'){S.pr.checks[parseInt(v,10)]=el.checked;renderPractice();}
 else if(act==='follow'){var a2=$('pr_ans');if(a2)S.pr.answer=a2.value;S.pr.follow=true;renderPractice();}
 else if(act==='savemy'){var a3=$('pr_ans');if(a3)S.pr.answer=a3.value;if(S.pr.answer.trim()){store.mine[S.pr.obj]=S.pr.answer.trim();setStore();S.pr.saved=true;renderPractice();}}
 else if(act==='done'){
  var a4=$('pr_ans');if(a4)S.pr.answer=a4.value;
  var sc=S.pr.checks.filter(function(x){return x;}).length;
  store.recs.push({d:todayStr(),t:S.type,o:S.pr.obj,s:sc});
  if(store.recs.length>300)store.recs=store.recs.slice(-300);
  setStore();newQuestion();renderPractice();
 }
 else if(act==='resetrec'){store.recs=[];setStore();renderPractice();}
 else if(act==='scn'){patNew(v);renderPattern();}
 else if(act==='pview'){if(S.pt){S.pt.view=(S.pt.view==='flow')?'play':'flow';renderPattern();}}
 else if(act==='pagain'){if(S.pt){patNew(S.pt.sid);S.pt.mode='quiz';renderPattern();}}
 else if(act==='pick'){var pi=S.pt.i;if(S.pt.picks[pi]===undefined){S.pt.picks[pi]=parseInt(v,10);renderPattern();}}
 else if(act==='rnext'){if(S.pt){S.pt.i++;renderPattern();window.scrollTo(0,0);}}
 else if(act==='rprev'){if(S.pt&&S.pt.i>0){S.pt.i--;renderPattern();window.scrollTo(0,0);}}
 else if(act==='rquiz'){if(S.pt){S.pt.mode='quiz';S.pt.i=0;S.pt.picks=[];S.pt.order=[];S.pt.saved=false;renderPattern();window.scrollTo(0,0);}}
 else if(act==='pnext'){
  var sc2=patScn(),tr2=patTurns(sc2);
  S.pt.i++;
  if(S.pt.i>=tr2.length&&!S.pt.saved){
   store.pat.push({d:todayStr(),n:typeById(S.type).name+' · '+sc2.title,p:patPoints(tr2),m:tr2.length*2});
   if(store.pat.length>200)store.pat=store.pat.slice(-200);
   S.pt.saved=true;setStore();
  }
  renderPattern();window.scrollTo(0,0);
 }
});
function fallbackCopy(txt,done){
 try{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);done();}catch(e){}
}
function refresh(){
 if(S.screen==='call')renderCall();
 else if(S.screen==='pattern')renderPattern();
 else if(S.screen==='objp'&&S.pr.revealed)renderPractice();
}
function bindInput(id,key,persist){
 var el=$(id);if(!el)return;
 el.addEventListener('input',function(){
  S[key]=el.value;
  if(persist){store[persist]=el.value;setStore();}
  refresh();
 });
}
$('in_honor').value=S.honor;
$('in_me').value=S.me;
bindInput('in_cust','cust');
bindInput('in_me','me','me');
bindInput('in_prem','prem');
bindInput('in_birth','birth');
$('in_honor').addEventListener('change',function(){S.honor=$('in_honor').value;store.honor=S.honor;setStore();refresh();});

render();
})();
</script>
</body>
