<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입사 프로세스 트래커</title>
<style>
  :root {
    --navy: #16233F;
    --navy-2: #1E2F52;
    --paper: #F3F1EC;
    --line: #D9D5CA;
    --ink: #1B1B1B;
    --muted: #6B6558;
    --amber: #B8863B;
    --green: #3C6E52;
    --green-bg: #E7EFE9;
    --amber-bg: #F5EBDA;
    --red: #A23B32;
    --red-bg: #F4E4E1;
    --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
  }
  .app { display: flex; min-height: 100vh; }
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; }
    .main { padding: 20px 16px; }
  }

  /* Sidebar */
  .sidebar {
    width: 280px;
    background: var(--navy);
    color: #EDEAE1;
    padding: 24px 18px;
    flex-shrink: 0;
  }
  .sidebar h1 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 4px 0;
  }
  .sidebar .sub {
    font-size: 12px;
    color: #9CA6BC;
    margin-bottom: 20px;
  }
  .add-btn {
    width: 100%;
    background: #2A3E66;
    color: #EDEAE1;
    border: 1px solid #3A4E78;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .add-btn:hover { background: #33477A; }
  .candidate-item {
    padding: 12px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 6px;
    border: 1px solid transparent;
  }
  .candidate-item:hover { background: #1F3157; }
  .candidate-item.active {
    background: #24365E;
    border-color: #3A4E78;
  }
  .candidate-item .cname { font-size: 14px; font-weight: 600; }
  .candidate-item .cmeta { font-size: 11px; color: #9CA6BC; margin-top: 2px; }
  .candidate-progress {
    height: 4px;
    background: #33477A;
    border-radius: 2px;
    margin-top: 8px;
    overflow: hidden;
  }
  .candidate-progress-bar {
    height: 100%;
    background: #7FB08F;
  }
  .empty-side { font-size: 12px; color: #7C86A0; padding: 8px 10px; }

  /* Main */
  .main {
    flex: 1;
    padding: 32px 40px;
    max-width: 860px;
  }
  .welcome {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.7;
    max-width: 480px;
  }
  .welcome h2 { color: var(--ink); font-size: 20px; margin-bottom: 8px; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 4px;
  }
  .cand-title { font-size: 24px; font-weight: 700; margin: 0; }
  .cand-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .del-btn {
    background: none; border: 1px solid var(--line); color: var(--red);
    border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
  }
  .del-btn:hover { background: var(--red-bg); }

  .overall-bar-wrap {
    margin: 18px 0 28px 0;
  }
  .overall-bar {
    height: 8px; background: var(--line); border-radius: 4px; overflow: hidden;
  }
  .overall-bar-fill { height: 100%; background: var(--green); transition: width 0.3s; }
  .overall-label { font-size: 12px; color: var(--muted); margin-top: 6px; }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 24px;
    font-size: 13px;
  }
  .info-grid label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 4px; }
  .info-grid input {
    width: 100%; border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; font-size: 13px; background: #FCFCFA;
  }
  .rrn-note {
    grid-column: 1 / -1;
    font-size: 11px; color: var(--amber); background: var(--amber-bg);
    border-radius: 6px; padding: 8px 10px; line-height: 1.5;
  }

  .step {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
  }
  .step-head {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px;
    cursor: pointer;
  }
  .step-num {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
    background: var(--line); color: var(--muted);
  }
  .step.done .step-num { background: var(--green); color: white; }
  .step-title { font-size: 14.5px; font-weight: 600; flex: 1; }
  .step-status { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; }
  .status-todo { background: var(--line); color: var(--muted); }
  .status-progress { background: var(--amber-bg); color: var(--amber); }
  .status-done { background: var(--green-bg); color: var(--green); }
  .status-warn { background: var(--red-bg); color: var(--red); }
  .chevron { font-size: 12px; color: var(--muted); transition: transform 0.2s; }
  .step.open .chevron { transform: rotate(90deg); }

  .step-body {
    display: none;
    padding: 0 16px 16px 52px;
    font-size: 13px;
  }
  .step.open .step-body { display: block; }

  .field-row { margin-bottom: 12px; }
  .field-row label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field-row input[type="date"] {
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 13px;
  }
  .check-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px; cursor: pointer;
  }
  .check-row input { width: 16px; height: 16px; cursor: pointer; }
  .check-row span { font-size: 13px; }
  .check-row.checked span { text-decoration: line-through; color: var(--muted); }

  .calc-box {
    border-radius: 8px; padding: 10px 12px; font-size: 12.5px; margin: 10px 0 14px 0; line-height: 1.6;
  }
  .calc-ok { background: var(--green-bg); color: var(--green); }
  .calc-warn { background: var(--red-bg); color: var(--red); }
  .calc-neutral { background: #EFEDE6; color: var(--muted); }

  .copy-box {
    background: #FAFAF7; border: 1px dashed var(--line); border-radius: 8px;
    padding: 10px 12px; font-size: 12px; color: var(--muted);
    white-space: pre-wrap; margin: 8px 0; position: relative; max-height: 140px; overflow-y: auto;
  }
  .copy-btn {
    background: var(--navy); color: white; border: none; border-radius: 6px;
    padding: 6px 12px; font-size: 12px; cursor: pointer; margin-top: 6px;
  }
  .copy-btn:hover { background: var(--navy-2); }

  .checkbox-3y {
    margin-top: 6px;
  }

  .storage-status { font-size: 11.5px; line-height: 1.5; padding: 8px 10px; border-radius: 6px; margin-top: 16px; }
  .storage-status.ok { background: #1F3A33; color: #A8D8B9; }
  .storage-status.err { background: #5A2A26; color: #FFD6D0; font-weight: 700; }
  .side-btn { width: 100%; background: transparent; color: #C9D0E0; border: 1px solid #3A4E78; border-radius: 6px; padding: 7px; font-size: 12px; cursor: pointer; margin-top: 8px; }
  .side-btn:hover { background: #24365E; }
  .side-note { font-size: 11px; color: #7C86A0; margin-top: 10px; line-height: 1.5; }
  .ov-btn { width: 100%; background: transparent; color: #EDEAE1; border: 1px solid #3A4E78; border-radius: 8px; padding: 9px; font-size: 12.5px; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
  .ov-btn:hover, .ov-btn.on { background: #24365E; }
  .exam-alert { border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin: 0 0 8px 0; line-height: 1.5; }
  .exam-alert.bad { background: var(--red-bg); color: var(--red); font-weight: 700; }
  .exam-alert.warn { background: var(--amber-bg); color: var(--amber); font-weight: 600; }
  .exam-alert.ok { background: var(--green-bg); color: var(--green); }
  .exam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-bottom: 12px; }
  .exam-grid .field-row { margin-bottom: 0; }
  .exam-grid input[type="text"], .exam-grid select, .exam-sel, .log-form input[type="text"], .log-form select {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 13px; background: #FCFCFA;
  }
  .dd { font-size: 12px; font-weight: 700; margin-left: 6px; }
  .dd.soon { color: var(--red); }
  .dd.near { color: var(--amber); }
  .sec-title { font-size: 12.5px; font-weight: 700; color: var(--navy); margin: 14px 0 8px 0; }
  .type-row { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
  .type-row label { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
  .mini-btn { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .mini-btn:hover { background: var(--lb, #EEF3FA); }
  .mini-btn.red { color: var(--red); }
  .log-form { display: grid; grid-template-columns: 130px 90px 1fr auto; gap: 8px; align-items: center; margin: 8px 0 10px 0; }
  .log-item { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 12.5px; background: #FCFCFA; display: flex; gap: 10px; align-items: flex-start; }
  .log-item .lt { flex: 1; line-height: 1.5; word-break: break-all; }
  .lv { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .lv-양호 { background: var(--green-bg); color: var(--green); }
  .lv-보통 { background: var(--amber-bg); color: var(--amber); }
  .lv-미흡 { background: var(--red-bg); color: var(--red); }
  table.ov { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-size: 12.5px; }
  table.ov th { background: #EFEDE6; color: var(--muted); font-weight: 700; padding: 8px 10px; text-align: left; font-size: 11.5px; }
  table.ov td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
  table.ov tr.row { cursor: pointer; }
  table.ov tr.row:hover td { background: #FAF9F4; }
  .ov-scroll { overflow-x: auto; }
  @media (max-width: 760px) {
    .exam-grid { grid-template-columns: 1fr; }
    .log-form { grid-template-columns: 1fr 1fr; }
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <h1>입사 프로세스</h1>
    <div class="sub">광주센터 · 위촉 체크리스트</div>
    <button class="add-btn" onclick="addCandidate()">+ 신규 후보자 추가</button>
    <button class="ov-btn" id="examOvBtn" onclick="showExamOverview()">📝 시험 일정·점검 현황</button>
    <div id="candidateList"></div>
    <div id="storageStatus" class="storage-status ok">저장 상태 확인 중...</div>
    <button class="side-btn" onclick="exportBackup()">백업 파일 저장</button>
    <button class="side-btn" onclick="document.getElementById('importFile').click()">백업 파일 불러오기</button>
    <input type="file" id="importFile" accept=".json,application/json" style="display:none" onchange="importBackup(this)">
    <div class="side-note">자동저장은 이 PC의 이 브라우저 안에 됩니다. 같은 파일을 같은 브라우저로 열어야 목록이 보입니다. 가끔 '백업 파일 저장'으로 따로 보관해두세요.</div>
  </div>
  <div class="main" id="main">
    <div class="welcome">
      <h2>후보자를 추가해주세요</h2>
      왼쪽에서 '신규 후보자 추가'를 눌러 이름을 입력하면<br>
      7단계 위촉 프로세스를 순서대로 체크할 수 있습니다.
    </div>
  </div>
</div>

<script>
const STEP_DEFS = [
  { key: 'career', title: '생손보 경력조회' },
  { key: 'edu', title: '연수원 교육이수 확인' },
  { key: 'apply', title: '입사지원서 작성 및 승인' },
  { key: 'redoc', title: '다위촉문서 발송요청' },
  { key: 'commission', title: '위촉신청서류 처리' },
  { key: 'training', title: '신입교육일정 안내' },
  { key: 'pc', title: '컴퓨터 세팅' },
];

let candidates = {}; // id -> {name, contact, address, steps: {...}}
let candidateOrder = [];
let activeId = null;
let openStep = 'career';
let view = 'cand'; /* 'cand' = 후보자 화면, 'exam' = 시험 현황 화면 */
let examDraft = { date: '', level: '보통', memo: '' };

function uid() { return 'c' + Date.now() + Math.random().toString(36).slice(2,7); }

function defaultSteps() {
  return {
    career: { needsRetest: null, requested3y: false, dueDate: '', certDate: '', reported: false, examBooked: false },
    edu: { lastEduDate: '', confirmed: false, reapplied: false },
    apply: { linkSent: false, filled: false, approvalRequested: false, approved: false },
    redoc: { requested: false },
    commission: { received: false, filled: false, scannedToFM: false, mailedHQ: false },
    training: { date: '', notified: false },
    pc: { done: false },
  };
}

const LS_KEY = 'afg_onboarding_v2';
let lsAvailable = null;

function lsOK() {
  if (lsAvailable !== null) return lsAvailable;
  try {
    const k = '__afg_test__';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
    lsAvailable = true;
  } catch (e) { lsAvailable = false; }
  return lsAvailable;
}

function hasCloudStorage() {
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.set === 'function';
}

function setStatus(ok, msg) {
  const el = document.getElementById('storageStatus');
  if (!el) return;
  el.className = 'storage-status ' + (ok ? 'ok' : 'err');
  el.textContent = msg;
}

function nowLabel() {
  const d = new Date();
  return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
}

function snapshot() {
  return JSON.stringify({ v: 2, order: candidateOrder, candidates: candidates });
}

async function persist() {
  const data = snapshot();
  let ok = false;
  if (lsOK()) {
    try { window.localStorage.setItem(LS_KEY, data); ok = true; } catch (e) { console.error('localStorage save failed', e); }
  }
  if (hasCloudStorage()) {
    try { await window.storage.set(LS_KEY, data, false); ok = true; } catch (e) { console.error('window.storage save failed', e); }
  }
  if (ok) setStatus(true, '✓ 자동저장됨 (' + nowLabel() + ')');
  else setStatus(false, '⚠ 저장 실패! 이 화면에서는 자동저장이 되지 않습니다. 닫기 전에 왼쪽 아래 "백업 파일 저장"을 꼭 눌러주세요. (시크릿 모드이거나 브라우저 저장이 차단된 상태일 수 있습니다)');
  return ok;
}

function saveCandidate() { return persist(); }
function saveIndex() { return persist(); }

function defaultExam() {
  return {
    target: 'auto', types: [], examDate: '', applyDeadline: '', place: '',
    applied: false, appliedDate: '', result: '',
    checks: { material: false, study: false, progress: false, mock: false, notice: false },
    nextCheck: '', logs: []
  };
}

function normalizeExam(x) {
  const b = defaultExam();
  if (!x || typeof x !== 'object') return b;
  ['target', 'examDate', 'applyDeadline', 'place', 'appliedDate', 'result', 'nextCheck'].forEach(function (k) { if (typeof x[k] === 'string') b[k] = x[k]; });
  if (['auto', 'yes', 'no'].indexOf(b.target) < 0) b.target = 'auto';
  b.applied = !!x.applied;
  if (Array.isArray(x.types)) b.types = x.types.filter(function (t) { return typeof t === 'string'; });
  if (x.checks && typeof x.checks === 'object') Object.keys(b.checks).forEach(function (k) { b.checks[k] = !!x.checks[k]; });
  if (Array.isArray(x.logs)) {
    b.logs = x.logs.filter(function (l) { return l && typeof l === 'object'; }).map(function (l) {
      return { id: String(l.id || uid()), date: String(l.date || ''), level: ['양호', '보통', '미흡'].indexOf(l.level) >= 0 ? l.level : '보통', memo: String(l.memo || '') };
    });
  }
  return b;
}

function normalizeCandidate(c) {
  const base = defaultSteps();
  const out = { name: String((c && c.name) || ''), contact: String((c && c.contact) || ''), address: String((c && c.address) || ''), steps: base, exam: normalizeExam(c && c.exam) };
  const st = (c && c.steps) || {};
  Object.keys(base).forEach(function (k) {
    if (st[k] && typeof st[k] === 'object') {
      Object.keys(base[k]).forEach(function (f) { if (st[k][f] !== undefined) base[k][f] = st[k][f]; });
    }
  });
  return out;
}

function applyData(raw) {
  const d = JSON.parse(raw);
  if (!d || !Array.isArray(d.order) || !d.candidates || typeof d.candidates !== 'object') throw new Error('bad-format');
  const cs = {};
  const order = [];
  d.order.forEach(function (id) {
    if (d.candidates[id]) { cs[id] = normalizeCandidate(d.candidates[id]); order.push(id); }
  });
  candidates = cs;
  candidateOrder = order;
  activeId = order.length ? order[0] : null;
  openStep = 'career';
}

async function loadAll() {
  let loaded = false;
  let corrupt = false;
  let raw = null;
  if (lsOK()) {
    try { raw = window.localStorage.getItem(LS_KEY); } catch (e) { raw = null; }
  }
  if (!raw && hasCloudStorage() && typeof window.storage.get === 'function') {
    try {
      const r = await window.storage.get(LS_KEY, false);
      if (r && r.value) raw = r.value;
    } catch (e) { raw = null; }
  }
  if (raw) {
    try { applyData(raw); loaded = true; }
    catch (e) {
      console.error('load failed', e);
      corrupt = true;
      try { if (lsOK()) window.localStorage.setItem(LS_KEY + '_corrupt_backup', raw); } catch (e2) {}
    }
  }
  /* 예전 버전(후보자별 저장) 데이터 이전 */
  if (!loaded && hasCloudStorage() && typeof window.storage.get === 'function') {
    try {
      const idx = await window.storage.get('onboarding:index', false);
      const order = idx ? JSON.parse(idx.value) : [];
      const cs = {};
      const ok = [];
      for (const id of order) {
        try {
          const res = await window.storage.get('onboarding:' + id, false);
          if (res) { cs[id] = normalizeCandidate(JSON.parse(res.value)); ok.push(id); }
        } catch (e) { /* skip */ }
      }
      if (ok.length) { candidates = cs; candidateOrder = ok; activeId = ok[0]; loaded = true; persist(); }
    } catch (e) { /* none */ }
  }
  if (!lsOK() && !hasCloudStorage()) {
    setStatus(false, '⚠ 이 화면에서는 자동저장이 되지 않습니다. 시크릿 모드가 아닌 일반 크롬 창에서 열어주세요. 닫기 전에 "백업 파일 저장"을 꼭 눌러주세요.');
  } else if (corrupt) {
    setStatus(false, '⚠ 저장된 데이터를 읽지 못했습니다. 이전 데이터는 따로 보관해두었으니, 먼저 백업 파일이 있다면 "백업 파일 불러오기"를 사용해주세요.');
  } else if (loaded) {
    setStatus(true, '✓ 저장된 후보자 ' + candidateOrder.length + '명을 불러왔습니다');
  } else {
    setStatus(true, '✓ 자동저장 사용 가능 (아직 저장된 후보자 없음)');
  }
  renderSidebar();
  renderMain();
}

function exportBackup() {
  const d = new Date();
  const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  try {
    const blob = new Blob([snapshot()], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '입사프로세스_백업_' + ymd + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
    setStatus(true, '✓ 백업 파일을 저장했습니다 (' + nowLabel() + ')');
  } catch (e) {
    setStatus(false, '⚠ 백업 파일 저장에 실패했습니다.');
  }
}

function importBackup(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function () {
    try {
      const tmp = JSON.parse(r.result);
      if (!tmp || !Array.isArray(tmp.order)) throw new Error('bad-format');
      if (!confirm('백업 파일(' + tmp.order.length + '명)을 불러오면 현재 목록이 백업 내용으로 바뀝니다. 계속할까요?')) { input.value = ''; return; }
      applyData(r.result);
      persist();
      renderSidebar();
      renderMain();
    } catch (e) {
      alert('백업 파일을 읽을 수 없습니다. 이 도구에서 저장한 백업 파일(.json)인지 확인해주세요.');
    }
    input.value = '';
  };
  r.readAsText(f);
}

async function deleteCandidate(id) {
  if (!confirm('이 후보자의 체크리스트를 삭제할까요? 되돌릴 수 없습니다.')) return;
  candidateOrder = candidateOrder.filter(c => c !== id);
  delete candidates[id];
  saveIndex();
  if (activeId === id) activeId = candidateOrder[0] || null;
  renderSidebar();
  renderMain();
}

function stepDoneCount(steps) {
  let done = 0;
  if (steps.career.reported && (calcRetest(steps.career) === false || steps.career.examBooked)) done++;
  if (steps.edu.confirmed && (!needsEduRedo(steps) || steps.edu.reapplied)) done++;
  if (steps.apply.linkSent && steps.apply.filled && steps.apply.approvalRequested && steps.apply.approved) done++;
  if (steps.redoc.requested) done++;
  if (steps.commission.received && steps.commission.filled && steps.commission.scannedToFM && steps.commission.mailedHQ) done++;
  if (steps.training.notified) done++;
  if (steps.pc.done) done++;
  return done;
}

function needsEduRedo(steps) {
  if (!steps.edu.lastEduDate) return null;
  const last = new Date(steps.edu.lastEduDate);
  const now = new Date();
  const diffDays = (now - last) / (1000*60*60*24);
  return diffDays > 365;
}

function calcRetest(career) {
  if (!career.certDate) return null;
  if (career.requested3y) return false; // 3년이내 365일이상 경력 있으면 재시험 불필요
  const cert = new Date(career.certDate);
  const ref = career.dueDate ? new Date(career.dueDate) : new Date();
  const diffDays = (ref - cert) / (1000*60*60*24);
  return diffDays > 365;
}

function escapeHtml(s) {
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function updateField(path, value) {
  const c = candidates[activeId];
  const parts = path.split('.');
  let obj = c;
  for (let i=0;i<parts.length-1;i++) obj = obj[parts[i]];
  obj[parts[parts.length-1]] = value;
  if (path === 'steps.career.examBooked') {
    c.exam.applied = !!value;
    if (value && !c.exam.appliedDate) c.exam.appliedDate = todayStr();
    if (!value) c.exam.appliedDate = '';
  }
  if (path === 'exam.applied') {
    c.steps.career.examBooked = !!value;
    if (value && !c.exam.appliedDate) c.exam.appliedDate = todayStr();
    if (!value) c.exam.appliedDate = '';
  }
  saveCandidate(activeId);
  renderSidebar();
  renderMain();
}

function copyText(elId, btn) {
  const el = document.getElementById(elId);
  if (!el) return;
  const text = el.textContent;
  function done() {
    if (!btn) return;
    const orig = btn.textContent;
    btn.textContent = '복사됨!';
    setTimeout(function () { btn.textContent = orig; }, 1200);
  }
  function fallback() {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) done(); else if (btn) btn.textContent = '복사 실패';
    } catch (e) { if (btn) btn.textContent = '복사 실패'; }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback);
    else fallback();
  } catch (e) { fallback(); }
}

/* ================= 시험 관리 ================= */
function pad2(n) { return String(n).padStart(2, '0'); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function parseDate(str) { const p = String(str).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function dayDiff(str) {
  if (!str) return null;
  const t = parseDate(str);
  if (isNaN(t.getTime())) return null;
  const n = new Date();
  const t0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((t - t0) / 86400000);
}
function ddayLabel(n) { if (n === null) return ''; if (n === 0) return 'D-Day'; return n > 0 ? ('D-' + n) : ('D+' + (-n)); }
function addDays(str, days) {
  const t = parseDate(str);
  const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + days);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}
function fmtDate(str) {
  if (!str) return '-';
  const t = parseDate(str);
  if (isNaN(t.getTime())) return '-';
  return (t.getMonth() + 1) + '/' + t.getDate() + '(' + ['일', '월', '화', '수', '목', '금', '토'][t.getDay()] + ')';
}
function ddClass(n) { if (n === null) return ''; if (n >= 0 && n <= 3) return 'soon'; if (n > 3 && n <= 7) return 'near'; if (n < 0) return 'soon'; return ''; }

function examNeeded(c) {
  const t = c.exam.target;
  if (t === 'yes') return true;
  if (t === 'no') return false;
  return calcRetest(c.steps.career) === true;
}
function lastLog(e) {
  let best = null;
  e.logs.forEach(function (l) { if (!best || String(l.date) > String(best.date)) best = l; });
  return best;
}
function examAlerts(c) {
  const e = c.exam, out = [];
  if (!examNeeded(c) || e.result === '합격') return out;
  const dEx = dayDiff(e.examDate), dDl = dayDiff(e.applyDeadline), dNext = dayDiff(e.nextCheck);
  if (e.result === '불합격') { out.push({ lv: 'bad', t: '불합격 — 재응시 일정을 새로 잡아주세요' }); }
  if (!e.examDate && !e.applied && e.result !== '불합격') out.push({ lv: 'warn', t: '시험 일정이 아직 없어요. 담당 과장과 일정을 확인해 입력하세요' });
  if (e.applyDeadline && !e.applied && dDl !== null) {
    if (dDl < 0) out.push({ lv: 'bad', t: '접수 마감이 지났는데 아직 접수 전이에요 (' + ddayLabel(dDl) + ')' });
    else if (dDl <= 7) out.push({ lv: dDl <= 3 ? 'bad' : 'warn', t: '접수 마감 ' + ddayLabel(dDl) + ' — 아직 접수 전' });
  }
  if (e.examDate && !e.applyDeadline && !e.applied) out.push({ lv: 'warn', t: '접수 마감일을 입력해 주세요' });
  if (e.examDate && dEx !== null && dEx >= 0 && dEx <= 7) out.push({ lv: 'warn', t: '시험 ' + ddayLabel(dEx) + ' — 시험 전 안내(일시·장소·준비물) 확인' });
  if (e.examDate && dEx !== null && dEx < 0 && !e.result) out.push({ lv: 'warn', t: '시험일이 지났어요. 결과를 입력해 주세요' });
  if (e.nextCheck && dNext !== null && dNext <= 0) out.push({ lv: 'bad', t: '준비 점검이 필요해요 (' + (dNext === 0 ? '오늘' : (-dNext) + '일 지남') + ')' });
  const last = lastLog(e);
  if (last && last.level === '미흡') out.push({ lv: 'warn', t: '최근 점검에서 준비 미흡으로 기록됐어요' });
  if (!e.logs.length && e.examDate && dEx !== null && dEx >= 0 && dEx <= 30) out.push({ lv: 'warn', t: '시험이 30일 안인데 점검 기록이 아직 없어요' });
  return out;
}
function examBrief(c) {
  const e = c.exam;
  let t = '';
  if (e.result === '불합격') t = '불합격·재응시';
  else if (e.examDate) t = ddayLabel(dayDiff(e.examDate)) + ' ' + (e.applied ? '접수완료' : '접수필요');
  else t = '시험일 미정';
  if (examAlerts(c).some(function (a) { return a.lv === 'bad'; })) t += ' ⚠';
  return t;
}
function examBadge(c) {
  const e = c.exam;
  if (!examNeeded(c)) return '<span class="step-status status-todo">해당 없음</span>';
  if (e.result === '합격') return '<span class="step-status status-done">합격</span>';
  if (e.result === '불합격') return '<span class="step-status status-warn">불합격·재응시</span>';
  if (e.applied) return '<span class="step-status status-progress">접수 완료</span>';
  return '<span class="step-status status-warn">' + (e.examDate ? '접수 필요' : '일정 확인') + '</span>';
}

function toggleExamType(name, checked) {
  const c = candidates[activeId];
  const i = c.exam.types.indexOf(name);
  if (checked && i < 0) c.exam.types.push(name);
  if (!checked && i >= 0) c.exam.types.splice(i, 1);
  saveCandidate(activeId);
  renderSidebar();
  renderMain();

function setNextCheckIn(days) {

function addExamLog() {
  const c = candidates[activeId];
  if (!c) return;
  const date = examDraft.date || todayStr();
  const level = ['양호', '보통', '미흡'].indexOf(examDraft.level) >= 0 ? examDraft.level : '보통';
  const memo = String(examDraft.memo || '').trim();
  c.exam.logs.push({ id: uid(), date: date, level: level, memo: memo });

  renderSidebar();
  renderMain();
}
function deleteExamLog(id) {
  const c = candidates[activeId];

  c.exam.logs = c.exam.logs.filter(function (l) { return l.id !== id; });
  saveCandidate(activeId);

  renderMain();
}
function resetForRetake() {
  const c = candidates[activeId];

  const e = c.exam;
  e.logs.push({ id: uid(), date: todayStr(), level: '미흡', memo: '불합격 (시험일 ' + (e.examDate || '미입력') + ') → 재응시 준비' });
  e.logs.sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  e.examDate = ''; e.applyDeadline = ''; e.applied = false; e.appliedDate = ''; e.result = '';
  e.nextCheck = addDays(todayStr(), 3);
  c.steps.career.examBooked = false;
  saveCandidate(activeId);
  renderSidebar();
  renderMain();
}

        <td>${e.applied ? '<span style="color:var(--green);font-weight:700">접수 완료</span>' : ('<span style="color:var(--red);font-weight:700">접수 전</span>' + (e.applyDeadline ? '<br>마감 ' + fmtDate(e.applyDeadline) + ' <span class="dd ' + ddClass(dDl) + '" style="margin-left:0">' + ddayLabel(dDl) + '</span>' : ''))}</td>
        <td>${e.place ? escapeHtml(e.place) : '<span style="color:var(--muted)">-</span>'}</td>
        <td>${last ? fmtDate(last.date) + ' <span class="lv lv-' + last.level + '">' + last.level + '</span><br><span style="color:var(--muted)">' + (lastD === 0 ? '오늘' : (-lastD) + '일 전') + '</span>' : '<span style="color:var(--muted)">기록 없음</span>'}</td>
        <td>${e.nextCheck ? fmtDate(e.nextCheck) + '<br><span class="dd ' + (dNext !== null && dNext <= 0 ? 'soon' : '') + '" style="margin-left:0">' + ddayLabel(dNext) + '</span>' : '<span style="color:var(--muted)">-</span>'}</td>
      </tr>`;
    });
    h += `</tbody></table></div>`;
  }
  return h;
}

loadAll();
</script>
</body>
</html>
